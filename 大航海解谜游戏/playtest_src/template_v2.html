:root[data-theme="dark"]{

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:15px/1.65 var(--f-body);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}

.brand small{display:block;font:500 11px var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--brass)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{font:inherit;font-size:13px;border:0;background:transparent;color:var(--ink);padding:5px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.sync{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--warn);display:inline-block}
.sync.on i{background:var(--ok)}
.wrap{padding-block:20px 80px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0}
h1{font-size:clamp(23px,4vw,30px);line-height:1.2}
h2{font-size:21px;margin:26px 0 10px}
h3{font-size:17px}
h4{margin:12px 0 6px;font-size:14px}
p{margin:6px 0}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--sea);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:6px 12px;font-size:14px}
.btn.primary{background:var(--sea);border-color:var(--sea);color:var(--panel)}
.btn.warn{border-color:var(--warn);color:var(--warn)}
.btn.small{padding:3px 9px;font-size:13px}
.btn[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--panel)}
.btn:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;min-width:0}
textarea{width:100%;min-height:64px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.muted,.note{color:var(--muted);font-size:13px}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--brass);font-weight:600;margin:0 0 4px}
.mono{font-family:var(--f-mono)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
th{background:var(--chip);font-weight:600}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.stack{display:grid;gap:12px}
.clock{font-family:var(--f-mono);font-size:22px}
.clock.over{color:var(--bad)}
.live{color:var(--ok);font-weight:600}
.story{border-left:3px solid var(--brass);padding-left:14px}
.banner{background:var(--warnbg);border:1px solid var(--warn);border-radius:10px;padding:10px 14px;display:flex;gap:10px;align-items:flex-start}
.act{display:flex;align-items:baseline;gap:10px;margin:24px 0 8px}
.act h3{font-size:18px}
.act .rule{flex:1;border-top:1px solid var(--line)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:8px;min-width:0}
.card.solved{border-color:var(--ok)}
.card.locked{opacity:.7}
.card-h{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.card-h h3{margin-right:auto}
.pid{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.chip{font-size:12px;border-radius:999px;padding:1px 9px;background:var(--chip);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--okbg);color:var(--ok)}
.chip.warn{background:var(--warnbg);color:var(--warn)}
.chip.bad{background:var(--badbg);color:var(--bad)}
.chip.cross{color:var(--sea)}

.msg{font-size:13px}.msg.bad{color:var(--bad)}
.reveal{background:var(--okbg);border-radius:8px;padding:10px 12px}
.hintrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.hint{background:var(--chip);border-radius:8px;padding:6px 10px;font-size:14px}
.answer{background:var(--warnbg);border-radius:8px;padding:8px 12px;font-size:14px}

.coins{font-family:var(--f-mono);font-size:20px;color:var(--brass)}

.logline{font-family:var(--f-mono);background:var(--chip);border-radius:6px;padding:6px 10px;display:inline-block}
.flagrow{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}

.flagchart svg{width:40px;height:40px;display:block;margin:0 auto 2px}
details.chart summary{cursor:pointer;color:var(--sea);font-size:14px}
.chestgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.fragment,.keycard{border:1px dashed var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.encport{font-family:var(--f-mono);font-size:20px;letter-spacing:.12em;margin:6px 0;word-break:break-word}
.halfline{font-style:italic}
.keyname{font-weight:600;font-size:13px}
.keytab td,.keytab th{padding:3px 5px;text-align:center;font-family:var(--f-mono);font-size:12px}
.morsegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:2px 8px;font-size:12px}
.morsegrid code{font-family:var(--f-mono)}
.letter{font-family:var(--f-display);font-size:16px;line-height:1.7}
.ports{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.port{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:4px}
.port.done{border-color:var(--ok);background:var(--okbg)}
.port .stamp{font-family:var(--f-display);font-size:28px;color:var(--bad);line-height:1}
.port .step{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.quizq{font-family:var(--f-display);font-size:19px}
.starbox{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.starbox svg{width:min(260px,80vw);height:auto;background:var(--chip);border-radius:10px}
.bottles{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.bottle{border:1px dashed var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:6px}
.bottle.won{border-style:solid;border-color:var(--ok)}
/* host */
.board td.cell{text-align:center;white-space:nowrap}
.board td.cell.ok{background:var(--okbg);color:var(--ok)}
.board td.cell.warn{background:var(--warnbg);color:var(--warn)}
.board td.cell.bad{background:var(--badbg);color:var(--bad)}
.board td.cell small{display:block;font-size:10px;color:var(--muted)}
.pm td{text-align:center}
.lockbox{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.lockbox input{width:140px;font-family:var(--f-mono)}
.rating{display:flex;gap:4px;flex-wrap:wrap}
.rating button{width:34px;height:34px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}
.rating button[aria-pressed="true"]{background:var(--sea);color:var(--panel);border-color:var(--sea)}
.fbgrid{display:grid;gap:10px}
.fbgrid label{font-size:14px;font-weight:600}
.scale{font-size:12px;color:var(--muted)}
.scorebar{height:8px;border-radius:4px;background:var(--brass)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

let since = null;
async function poll(){
  try {
    let q = SB.url + "/rest/v1/aod_docs?select=path,data,updated_at&order=updated_at.asc&limit=1000";
    if (since) q += "&updated_at=gt." + encodeURIComponent(new Date(Date.parse(since) - 5000).toISOString());
    const r = await fetch(q, {headers: hdr()}); if (!r.ok) throw new Error(r.status);
    const rows = await r.json(); let changed = false;
    for (const row of rows){
      if (!since || Date.parse(row.updated_at) > Date.parse(since)) since = row.updated_at;
      const p = fromRemote(row.path); if (!p) continue;
      if (JSON.stringify(docs[p]) !== JSON.stringify(row.data)){ docs[p] = row.data; changed = true; }
    }
    if (S.mode !== "shared"){ S.mode = "shared"; changed = true; }

}

  return shared ? (list[0] || null) : (list.find(e => e.team === team) || null);

function coins(team){
  const c = {chest:0, decode:0, help:0, ports:0, quiz:0, bottles:0, final:0, hints:0};
  const chestOrder = DATA.teams.map(n => [n, solveEv("A-chest", n, false)]).filter(x => x[1]).sort((a,b) => a[1].ts - b[1].ts).map(x => x[0]);
  const place = chestOrder.indexOf(team);
  if (place >= 0) c.chest = 2 + ([3,2,1][place] || 0);
  if (solveEv("B1", team, false)) c.decode = 2;
  DATA.teams.forEach(n => { if (String(DATA.keyholder[n]) === String(team) && solveEv("B1", n, false)) c.help += 2; });
  DATA.ports.forEach(p => c.ports += portScore(team, p));
  DATA.quiz.forEach((_, i) => { if (quizWinner(i) === team) c.quiz += 1; });
  DATA.bottles.forEach(b => { const e = bottleEv(b.id); if (e && e.team === team) c.bottles += 1; });
  const fe = solveEv("D1", 0, true);
  if (fe){ if (fe.team === team) c.final += 2; const el = elapsed(fe.ts); if (el != null && el <= DATA.onTime * 60000) c.final += 3; }
  c.hints = -Math.max(0, totalHints(team) - (DATA.hintTokens[team] || 0));
  c.total = Object.values(c).reduce((a,b) => a + b, 0);
  return c;
}

    else h += `<form class="gate" data-bottle="${b.id}"><input id="in-${b.id}" autocomplete="off" value="${esc(S.drafts[b.id] || "")}"><button class="btn" type="submit">${t("submit")}</button></form>`;
    const m = S.msgs[b.id]; if (m) h += `<p class="msg bad">${esc(m.text)}</p>`;
    if (answersVisible() && S.sol.keys[b.id]) h += `<div class="answer mono">${esc(S.sol.keys[b.id][0])}</div>`;
    return h + "</div>";
  }).join("") + "</div>";
}
function feedbackHTML(team){
  const id = "A2_" + team; const saved = S.fb[id] || {};
  const d = S.drafts["fb"] || (S.drafts["fb"] = Object.assign({}, saved));
  const scale = (f, sc) => `<div><label>${t(f)}</label><div class="scale">${t(sc)}</div><div class="rating">` + [1,2,3,4,5].map(n => `<button type="button" data-fb="${f}" data-v="${n}" aria-pressed="${Number(d[f]) === n}">${n}</button>`).join("") + "</div></div>";
  const favs = ["chest","ports","press","quiz","stars","bottles","final"];
  const stuckOpts = [`<option value="">${t("none")}</option>`].concat(DATA.puzzles.filter(p => teamsOf(p).includes(team)).map(p => `<option value="${p.id}" ${d.stuck === p.id ? "selected" : ""}>${p.id} · ${esc(L(p.title))}</option>`)).join("");
  return `<section class="panel stack" id="feedback"><h2 style="margin:0">${t("feedback")}</h2><p class="muted">${t("fbLead")}</p><form class="fbgrid" data-act="fb">` +
    scale("difficulty","diffScale") + scale("interactivity","interScale") + scale("fun","funScale") + scale("clarity","clarScale") + scale("pace","paceScale") +
    `<div><label for="fb-fav">${t("favorite")}</label><br><select id="fb-fav" data-fbf="favorite"><option value=""></option>${favs.map(f => `<option value="${f}" ${d.favorite === f ? "selected" : ""}>${t("fav_" + f)}</option>`).join("")}</select></div>` +
    `<div><label for="fb-stuck">${t("stuck")}</label><br><select id="fb-stuck" data-fbf="stuck">${stuckOpts}</select></div>` +
    `<div><label for="fb-change">${t("change1")}</label><textarea id="fb-change" data-fbf="change">${esc(d.change || "")}</textarea></div>` +
    `<div><label for="fb-comment">${t("comment")}</label><textarea id="fb-comment" data-fbf="comment">${esc(d.comment || "")}</textarea></div>` +
    `<div class="row"><button class="btn primary" type="submit">${t("saveFb")}</button>${saved.ts ? `<span class="chip ok">✓ ${t("saved")}</span>` : ""}</div></form></section>`;
}
function testerView(){
  if (!S.team) return picker();
  const team = S.team; const c = coins(team);
  const left = Math.max(0, (DATA.hintTokens[team] || 0) - totalHints(team));
  let h = `<div class="row" style="justify-content:space-between"><p class="eyebrow" style="margin:0"><span class="shipdot" style="--c:${DATA.colors[team]}"></span>${t("youAre")}: ${esc(ship(team))}</p><button class="btn small" type="button" data-act="changeTeam">${t("change")}</button></div>`;
  h += bannerHTML();
  h += `<section class="panel stack" style="margin-top:10px"><div class="card-h"><h1>${t("brand")}</h1><div>${clockHTML()}</div></div>` +
    `<div class="row"><span class="coins">${c.total}</span><span class="muted">${t("doubloons")}</span><span class="chip">${t("hintLeft")} ${left}</span></div>` +
    `<div class="story">${lang === "zh" ? "1519 年，四艘船准备寻找香料群岛。老船长把航海图撕成四片，锁进四个船长箱，每把钥匙都在另一条船上。开饭前，整支舰队要抵达终点。" : "1519. Four ships set out for the Spice Islands. The Admiral tore the chart into four and locked each piece in a chest whose key sits on another ship. The fleet must reach its destination before dinner."}</div></section>`;
  ["intra","cross","fleet","final"].forEach(stage => {
    const cards = DATA.puzzles.filter(p => p.stage === stage).map(p => cardHTML(p, team)).filter(Boolean);
    if (cards.length) h += `<div class="act"><h3>${t("act_" + stage)}</h3><div class="rule"></div></div><div class="stack">${cards.join("")}</div>`;
  });
  h += `<div class="act"><h3>${t("act_side")}</h3><div class="rule"></div></div>${bottlesHTML(team)}`;
  if (answersVisible()) h += `<h2>${t("solutions")}</h2><div class="panel tw">${L(S.sol.html)}</div>`;
  h += `<div style="height:20px"></div>` + feedbackHTML(team);
  return h;
}

// ---------------------------------------------------------------- host view
const dis = () => (S.isHost ? "" : "disabled");
function hostLock(){
  let h = `<section class="panel stack"><div class="card-h"><h3>${t("answersLock")}</h3>${hostUnlocked() ? `<span class="chip ok">✓</span>` : ""}${S.reveal && S.reveal.open ? `<span class="chip warn">${t("revealedAll")}</span>` : ""}</div>`;
  if (!hostUnlocked()){
    h += `<form class="lockbox" data-act="unlock"><label for="pw" class="muted">${t("pw")}</label><input id="pw" type="password" autocomplete="off"><button class="btn primary" type="submit">${t("unlock")}</button></form><p class="note">${t("needHost")}</p>`;
    const m = S.msgs.pw; if (m) h += `<p class="msg bad">${esc(m.text)}</p>`;
  } else {
    h += `<p class="muted">${t("unlockedLocal")}</p><div class="row">` + (S.reveal && S.reveal.open ? `<button class="btn" type="button" data-act="hideAll">${t("hideAll")}</button>` : `<button class="btn warn" type="button" data-act="revealAll">${t("revealAll")}</button>`) + `</div>`;
  }
  const m = S.msgs.host; if (m) h += `<p class="msg bad">${esc(m.text)}</p>`;
  return h + "</section>";
}
function hostClock(){
  return `<section class="panel stack"><div class="card-h"><h3>${t("session")}</h3><div>${clockHTML()}</div></div><div class="row">` +
    `<button class="btn primary" type="button" data-act="start" ${dis()}>${started() ? t("restart") : t("start")}</button>` +
    `<button class="btn" type="button" data-act="end" ${started() && !S.session.endedAt ? dis() : "disabled"}>${t("end")}</button></div></section>`;
}
function hostBroadcast(){
  const b = (k, act) => `<button class="btn" type="button" data-bc="${act}" ${dis()}>${t(k)}</button>`;
  return `<section class="panel stack"><h3>${t("broadcast")}</h3><div class="row">${b("b_wave1","wave1")}${b("b_press","press")}${b("b_wave2","wave2")}${b("b_storm","storm")}${b("b_stars","stars")}</div>` +
    `<form class="row" data-act="bcCustom"><input id="bc-text" style="flex:1 1 220px" placeholder="${t("custom")}" value="${esc(S.drafts["bc-text"] || "")}"><button class="btn primary" type="submit" ${dis()}>${t("send")}</button><button class="btn" type="button" data-act="bcClear" ${dis()}>${t("clearBc")}</button></form>` +
    (S.broadcast && S.broadcast.ts ? `<p class="note">${esc(L(S.broadcast.text))}</p>` : "") + `</section>`;
}
function hostPorts(){
  let h = `<section class="panel stack"><h3>${t("pmTitle")}</h3><p class="note">${t("pmLead")}</p><div class="tw"><table class="pm"><tr><th>${t("team")}</th>` + DATA.ports.map(p => `<th>${esc(L(DATA.portName[p]))} · ${DATA.portLetter[p]}</th>`).join("") + `</tr>`;
  DATA.teams.forEach(n => {
    h += `<tr><td><span class="shipdot" style="--c:${DATA.colors[n]}"></span>${esc(ship(n))}</td>` + DATA.ports.map(p => {
      const sc = portScore(n, p);
      return `<td><div class="row" style="justify-content:center">` + [0,2,3].map(v => `<button class="btn small" type="button" data-port="${n}|${p}|${v}" aria-pressed="${sc === v && v > 0}" ${dis()}>${v}</button>`).join("") + `</div></td>`;
    }).join("") + `</tr>`;
  });
  h += `</table></div>`;
  if (answersVisible()) h += `<details><summary>${lang === "zh" ? "马六甲判断题答案" : "Malacca answers"}</summary>${L(S.sol.malacca)}</details>`;
  return h + "</section>";
}
function hostQuiz(){
  const q = S.quiz || {}; const i = q.idx || 0; const w = quizWinner(i);
  let h = `<section class="panel stack"><div class="card-h"><h3>${t("quizTitle")}</h3><span class="chip">${i+1}/${DATA.quiz.length}</span></div>`;
  h += `<p class="quizq">${esc(L(DATA.quiz[i]))}</p>`;
  if (answersVisible()) h += `<p class="answer">${t("answer")}: ${esc(L(S.sol.quiz[i]))}</p>`;
  h += `<div class="row"><button class="btn" type="button" data-quiz="prev" ${dis()}>${t("prev")}</button><button class="btn" type="button" data-quiz="next" ${dis()}>${t("next")}</button>` +
    (q.open ? `<button class="btn" type="button" data-quiz="close" ${dis()}>${t("closeQuiz")}</button>` : `<button class="btn primary" type="button" data-quiz="open" ${dis()}>${t("openQuiz")}</button>`) + `</div>`;
  h += `<p class="eyebrow">${t("award")}</p><div class="row">` + DATA.teams.map(n => `<button class="btn small" type="button" data-qwin="${n}" aria-pressed="${w === n}" ${dis()}>${esc(ship(n))}</button>`).join("") + `<button class="btn small" type="button" data-qwin="0" ${dis()}>${t("nobody")}</button></div>`;
  return h + "</section>";
}
function cellOf(p, team, cum){
  if (!teamsOf(p).includes(team)) return `<td class="cell"></td>`;
  let ev = null;
  if (p.kind === "chant"){ const c = docs["ev/" + run() + "_chant_" + team]; ev = c || null; }
  else if (p.kind === "ports"){ const done = DATA.ports.filter(x => portScore(team, x)).length; return `<td class="cell ${done === 4 ? "ok" : ""}">${done}/4</td>`; }
  else if (p.kind === "quiz"){ const n = DATA.quiz.filter((_, i) => quizWinner(i) === team).length; return `<td class="cell">${n}</td>`; }
  else if (p.kind === "stars" && !p.gate){ ev = null; }
  else ev = solveEv(p.id, team, p.shared);
  const hs = hintsUsed(p.id, team).length, w = wrongs(p.id, team);
  const extra = (hs || w) ? `<small>${hs ? "H" + hs : ""}${hs && w ? " " : ""}${w ? "✕" + w : ""}</small>` : "";
  if (!ev) return `<td class="cell">·${extra}</td>`;
  const ms = elapsed(ev.ts); if (ms == null) return `<td class="cell ok">✓${extra}</td>`;
  const r = ms / (cum * 60000);
  return `<td class="cell ${r <= 1 ? "ok" : r <= 1.5 ? "warn" : "bad"}">${mmss(ms)}${extra}</td>`;
}
function hostBoard(){
  let h = `<section class="panel stack"><h3>${t("board")}</h3><p class="note">${t("boardLead")}</p><div class="tw"><table class="board"><tr><th>${t("team")}</th>` + DATA.puzzles.map(p => `<th title="${esc(L(p.title))}">${p.id}<br><span class="muted">${p.target}′</span></th>`).join("") + `<th>${t("c_bottles")}</th></tr>`;
  DATA.teams.forEach(n => {
    let cum = 3; h += `<tr><td><span class="shipdot" style="--c:${DATA.colors[n]}"></span>${esc(ship(n))}</td>`;
    DATA.puzzles.forEach(p => { cum += p.target; h += cellOf(p, n, cum); });
    h += `<td class="cell">${DATA.bottles.filter(b => { const e = bottleEv(b.id); return e && e.team === n; }).length}</td></tr>`;
  });
  return h + `</table></div></section>`;
}
function hostCoins(){
  const keys = ["chest","decode","help","ports","quiz","bottles","final","hints","total"];
  const rows = DATA.teams.map(n => [n, coins(n)]); const max = Math.max(1, ...rows.map(r => r[1].total));
  let h = `<section class="panel stack"><h3>${t("coinsTitle")}</h3><p class="note">${t("coinsLead")}</p><div class="tw"><table><tr><th>${t("team")}</th>` + keys.map(k => `<th>${t("c_" + k)}</th>`).join("") + `</tr>`;
  rows.forEach(([n, c]) => { h += `<tr><td><span class="shipdot" style="--c:${DATA.colors[n]}"></span>${esc(ship(n))}</td>` + keys.map(k => k === "total" ? `<td><b>${c.total}</b><div class="scorebar" style="width:${Math.max(4, c.total / max * 100)}%"></div></td>` : `<td>${c[k]}</td>`).join("") + `</tr>`; });
  return h + `</table></div></section>`;
}
function hostResults(){
  const fbs = DATA.teams.map(n => S.fb["A2_" + n]).filter(Boolean);
  const avg = f => { const v = fbs.map(x => Number(x[f])).filter(n => n > 0); return v.length ? (v.reduce((a,b) => a+b, 0) / v.length).toFixed(1) : "–"; };
  const fe = solveEv("D1", 0, true); const ft = fe ? elapsed(fe.ts) : null;
  let h = `<section class="panel stack"><h3>${t("results")}</h3><div class="tw"><table><tr><th>${t("responses")}</th><th>${t("difficulty")}</th><th>${t("interactivity")}</th><th>${t("fun")}</th><th>${t("clarity")}</th><th>${t("pace")}</th><th>${t("finished")}</th></tr>` +
    `<tr><td>${fbs.length}</td><td>${avg("difficulty")}</td><td>${avg("interactivity")}</td><td>${avg("fun")}</td><td>${avg("clarity")}</td><td>${avg("pace")}</td><td>${ft == null ? "–" : mmss(ft) + ` <span class="chip ${ft <= DATA.onTime*60000 ? "ok" : "bad"}">${ft <= DATA.onTime*60000 ? t("inTime") : t("overTime")}</span>`}</td></tr></table></div>`;
  if (!fbs.length) return h + `<p class="muted">${t("noData")}</p></section>`;
  h += `<h4>${t("comments")}</h4><ul>` + fbs.map(x => `<li><b>${esc(ship(x.team))}</b>${x.favorite ? ` · ${t("favorite")}: ${esc(t("fav_" + x.favorite))}` : ""}${x.stuck ? ` · ${t("stuck")}: ${esc(x.stuck)}` : ""}${x.change ? ` · ${esc(x.change)}` : ""}${x.comment ? ` · ${esc(x.comment)}` : ""}</li>`).join("") + `</ul>`;
  return h + `</section>`;
}
function hostProtocol(){
  const p = DATA.protocol;
  return `<section class="panel stack"><h3>${t("protocol")}</h3>${L(p.schedule)}<h4>${t("prep")}</h4>${L(p.prep)}<h4>${t("watch")}</h4><ul>${L(p.watch).map(w => `<li>${esc(w)}</li>`).join("")}</ul>` +
    `<h4>${t("notes")}</h4><form class="stack" data-act="notes"><textarea id="notes-text">${esc(S.drafts["notes-text"] ?? (S.notes.text || ""))}</textarea><div class="row"><button class="btn" type="submit" ${dis()}>${t("saveNotes")}</button></div></form></section>`;
}
function hostSolutions(){
  return `<section class="panel stack"><h3>${t("solutions")}</h3>${answersVisible() ? `<div class="tw">${L(S.sol.html)}</div>` : `<p class="muted">${t("lockedAnswers")}</p>`}</section>`;
}
function hostView(){
  return `<div class="stack"><h1>${t("hostTitle")}</h1>${bannerHTML()}${hostLock()}${hostClock()}${hostBroadcast()}${hostPorts()}${hostQuiz()}${hostBoard()}${hostCoins()}${hostResults()}${hostProtocol()}${hostSolutions()}</div>`;
}

// ---------------------------------------------------------------- render
async function fillReveals(root){
  if (S.view !== "tester" || !S.team) return;
  for (const el of root.querySelectorAll("[data-reveal]")){
    const p = P(el.dataset.reveal); const r = await revealOf(p, S.team);
    if (r && el.isConnected) el.innerHTML = L(r);
  }
}
function render(){
  document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
  document.getElementById("brandSmall").textContent = t("brandSmall"); document.getElementById("brandTitle").textContent = t("brand");
  document.getElementById("vTester").textContent = t("tester"); document.getElementById("vHost").textContent = t("host");
  document.getElementById("vTester").setAttribute("aria-pressed", S.view === "tester"); document.getElementById("vHost").setAttribute("aria-pressed", S.view === "host");
  document.getElementById("lZh").setAttribute("aria-pressed", lang === "zh"); document.getElementById("lEn").setAttribute("aria-pressed", lang === "en");
  const sy = document.getElementById("sync"); sy.classList.toggle("on", S.mode === "shared"); document.getElementById("syncText").textContent = S.mode === "shared" ? t("shared") : t("local");
  const app = document.getElementById("app");
  keepFocus(() => { app.innerHTML = S.view === "host" ? hostView() : testerView(); });
  hydrate(app); fillReveals(app);
}
setInterval(() => {
  const c = document.getElementById("clock");
  if (c && started() && !S.session.endedAt){ const ms = Date.now() - started(); c.textContent = mmss(ms); c.classList.toggle("over", ms > DATA.minutes*60000); }
}, 1000);

// ---------------------------------------------------------------- events
document.getElementById("vTester").onclick = () => { S.view = "tester"; LS.set("view","tester"); render(); };
document.getElementById("vHost").onclick = () => { S.view = "host"; LS.set("view","host"); render(); };
document.getElementById("lZh").onclick = () => { lang = "zh"; LS.set("lang", lang); render(); };
document.getElementById("lEn").onclick = () => { lang = "en"; LS.set("lang", lang); render(); };
const app = document.getElementById("app");
app.addEventListener("input", e => {
  const el = e.target;
  if (el.dataset.fbf){ S.drafts.fb[el.dataset.fbf] = el.value; return; }
  if (el.id === "in-chant"){ S.drafts.chant = el.value; return; }
  if (el.id && el.id.startsWith("in-")) S.drafts[el.id.slice(3)] = el.value; else if (el.id) S.drafts[el.id] = el.value;
});
app.addEventListener("change", e => { const el = e.target; if (el.dataset.fbf) S.drafts.fb[el.dataset.fbf] = el.value; });
app.addEventListener("submit", async e => {
  e.preventDefault(); const f = e.target; const team = S.team;
  if (f.dataset.gate){ await submitGate(P(f.dataset.gate), team, f.querySelector("input").value); return; }
  if (f.dataset.bottle){ await submitBottle(DATA.bottles.find(b => b.id === f.dataset.bottle), team, f.querySelector("input").value); return; }
  const act = f.dataset.act;
  if (act === "chant"){ const v = document.getElementById("in-chant").value.trim(); if (v) { await setEv("chant_" + team, {team, type: "chant", text: v}); S.drafts.chant = undefined; } }
  else if (act === "unlock"){
    const v = norm(document.getElementById("pw").value); const k = await hexHash("aod-sol|" + v); const sol = await dec("SOL#0", k, DATA.sol);
    if (sol){ S.solKey = k; LS.set("solKey", k); S.sol = sol; hostToken = await hexHash("aod-host|" + v); LS.set("hostToken", hostToken); S.isHost = true; render(); }
    else flash("pw", t("pwBad"), true);
  }
  else if (act === "fb"){ try { await store.set("fb/A2_" + team, Object.assign({}, S.drafts.fb, {team, ts: Date.now()})); } catch(err){ flash("fb", err.message, true); } }
  else if (act === "bcCustom"){ const v = document.getElementById("bc-text").value.trim(); if (v){ await control("broadcast", {text: {zh: v, en: v}, ts: Date.now()}); S.drafts["bc-text"] = ""; } }
  else if (act === "notes"){ await control("notes", {text: document.getElementById("notes-text").value, ts: Date.now()}); }
});
app.addEventListener("click", async e => {
  const b = e.target.closest("button"); if (!b) return; const d = b.dataset; const team = S.team;
  if (d.team){ S.team = Number(d.team); LS.set("team", S.team); S.drafts = {}; render(); return; }
  if (d.hint){ await logEv(team, d.hint, "hint", {level: Number(d.level)}); return; }
  if (d.fb){ S.drafts.fb[d.fb] = Number(d.v); render(); return; }
  if (d.port){ const [n, p, v] = d.port.split("|"); await setEv(`port_${n}_${p}`, {team: Number(n), port: p, score: Number(v), type: "port"}); return; }
  if (d.qwin){ const i = (S.quiz.idx || 0); await setEv(`quiz_${i}`, {team: Number(d.qwin), q: i, type: "quiz"}); return; }
  if (d.quiz){
    const q = Object.assign({idx: 0, open: false}, S.quiz);
    if (d.quiz === "next") q.idx = Math.min(DATA.quiz.length - 1, q.idx + 1);
    if (d.quiz === "prev") q.idx = Math.max(0, q.idx - 1);
    if (d.quiz === "open") q.open = true; if (d.quiz === "close") q.open = false;
    await control("quiz", q); return;
  }
  if (d.bc){
    const ev = DATA.events[d.bc]; await control("broadcast", {text: ev, ts: Date.now()});
    if (d.bc === "wave1") await control("bottles", {wave: Math.max(1, S.bottlesWave)});
    if (d.bc === "wave2") await control("bottles", {wave: 2});
    if (d.bc === "storm") await control("quiz", {idx: 0, open: true});
    return;
  }
  const act = d.act;
  if (act === "changeTeam"){ S.team = 0; LS.set("team", 0); render(); }
  else if (act === "dismissBc"){ S.dismissedBc = S.broadcast.ts; LS.set("dismissedBc", S.dismissedBc); render(); }
  else if (act === "chart"){ await setEv("chart_" + team, {team, type: "chart"}); }
  else if (act === "start"){
    await control("session", {id: "r" + Date.now(), startedAt: Date.now()});
    await control("quiz", {idx: 0, open: false}); await control("bottles", {wave: 0}); await control("broadcast", {text: "", ts: 0});
  }
  else if (act === "end"){ await control("session", Object.assign({}, S.session, {endedAt: Date.now()})); }
  else if (act === "revealAll"){ await control("reveal", {open: true, key: S.solKey, ts: Date.now()}); }
  else if (act === "hideAll"){ await control("reveal", {open: false, ts: Date.now()}); }
  else if (act === "bcClear"){ await control("broadcast", {text: "", ts: 0}); }
});

subscribeAll(); loadSol(); render();
if (SB) poll();
})();
</script>
