<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>大航海解谜 Playtest</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Young+Serif&display=swap">
<style>
/* Layout: a chart-room console. One reading column, sticky bridge bar on top, puzzle cards grouped by act. */
:root{
  --paper:#edf1ee; --panel:#f9fbf8; --ink:#13233a; --muted:#56657a; --line:#d0d8d3; --chip:#e1e8e4;
  --brass:#9a6b17; --sea:#1d5b6a; --ok:#2b7a4b; --warn:#a8660f; --bad:#ad3528; --okbg:#e2f1e7; --warnbg:#f8ecd6; --badbg:#f6e1dd;
  --f-display:"Young Serif", Georgia, "Songti SC", "Noto Serif SC", serif;
  --f-body:"IBM Plex Sans", "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Consolas, monospace;
  --flagR:#c8102e; --flagB:#0b3d91; --flagY:#ffcd00; --flagW:#ffffff; --flagK:#111111;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#0e1620; --panel:#152130; --ink:#e4ebf1; --muted:#9aa9b9; --line:#25364a; --chip:#1c2b3c;
  --brass:#d7a64a; --sea:#6ab7c7; --ok:#62c48d; --warn:#e3a54c; --bad:#ec7f71; --okbg:#173326; --warnbg:#3a2c14; --badbg:#3c1f1b; color-scheme:dark } }
:root[data-theme="dark"]{
  --paper:#0e1620; --panel:#152130; --ink:#e4ebf1; --muted:#9aa9b9; --line:#25364a; --chip:#1c2b3c;
  --brass:#d7a64a; --sea:#6ab7c7; --ok:#62c48d; --warn:#e3a54c; --bad:#ec7f71; --okbg:#173326; --warnbg:#3a2c14; --badbg:#3c1f1b; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:15px/1.65 var(--f-body);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--panel);border-bottom:1px solid var(--line)}
.bar-in,.wrap{max-width:960px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar-in{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding-block:10px}
.brand{font-family:var(--f-display);font-size:18px;margin-right:auto;line-height:1.2}
.brand small{display:block;font:500 11px var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--brass)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{font:inherit;font-size:13px;border:0;background:transparent;color:var(--ink);padding:5px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.sync{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--warn);display:inline-block}
.sync.on i{background:var(--ok)}
.wrap{padding-block:20px 80px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0}
h1{font-size:clamp(24px,4vw,32px);line-height:1.2}
h2{font-size:22px;margin:28px 0 10px}
h3{font-size:17px}
h4{margin:14px 0 6px;font-size:15px}
p{margin:6px 0}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--sea);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:6px 12px;font-size:14px}
.btn.primary{background:var(--sea);border-color:var(--sea);color:var(--panel)}
.btn.warn{border-color:var(--warn);color:var(--warn)}
.btn.small{padding:3px 9px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;min-width:0}
textarea{width:100%;min-height:70px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.muted,.note{color:var(--muted);font-size:13px}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--brass);font-weight:600;margin:0 0 4px}
.mono{font-family:var(--f-mono)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
th{background:var(--chip);font-weight:600}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.stack{display:grid;gap:12px}
.gametabs{display:flex;gap:8px;overflow-x:auto;margin:6px 0 14px}
.gametab{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:8px 14px;text-align:left;min-width:150px}
.gametab b{display:block;font-family:var(--f-display);font-weight:400;font-size:16px}
.gametab span{font-size:12px;color:var(--muted)}
.gametab[aria-pressed="true"]{border-color:var(--sea);box-shadow:inset 0 -3px 0 var(--sea)}
.live{color:var(--ok);font-weight:600}
.clock{font-family:var(--f-mono);font-size:22px}
.clock.over{color:var(--bad)}
.story{border-left:3px solid var(--brass);padding-left:14px}
.banner{background:var(--warnbg);border:1px solid var(--warn);color:var(--ink);border-radius:10px;padding:10px 14px;display:flex;gap:10px;align-items:flex-start}
.act{display:flex;align-items:baseline;gap:10px;margin:24px 0 8px}
.act h3{font-size:18px}
.act .rule{flex:1;border-top:1px solid var(--line)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:8px;min-width:0}
.card.solved{border-color:var(--ok)}
.card.locked{opacity:.7}
.card-h{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.card-h h3{margin-right:auto}
.pid{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.chip{font-size:12px;border-radius:999px;padding:1px 9px;background:var(--chip);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--okbg);color:var(--ok)}
.chip.warn{background:var(--warnbg);color:var(--warn)}
.chip.bad{background:var(--badbg);color:var(--bad)}
.chip.cross{background:var(--chip);color:var(--sea)}
.gate{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.gate label{font-size:13px;color:var(--muted);width:100%}
.gate input{flex:1 1 160px;font-family:var(--f-mono);letter-spacing:.06em;text-transform:uppercase}
.msg{font-size:13px}
.msg.bad{color:var(--bad)}
.reveal{background:var(--okbg);border-radius:8px;padding:10px 12px}
.hintrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.hint{background:var(--chip);border-radius:8px;padding:6px 10px;font-size:14px}
.answer{background:var(--warnbg);border-radius:8px;padding:8px 12px;font-size:14px}
.teampick{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.teampick button{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:12px;padding:12px;text-align:left}
.teampick button b{font-family:var(--f-display);font-weight:400;font-size:20px;display:block}
.teampick button span{display:block;font-size:12px;color:var(--muted)}
/* puzzle content */
.clues{padding-left:20px;margin:4px 0}
.logline{font-family:var(--f-mono);background:var(--chip);border-radius:6px;padding:6px 10px;display:inline-block}
.flagrow{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}
.flagrow svg{width:56px;height:56px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.25))}
.flagchart{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px;margin-top:8px}
.flagchart figure{margin:0;text-align:center;font-family:var(--f-mono);font-size:12px}
.flagchart svg{width:40px;height:40px;display:block;margin:0 auto 2px}
details.chart summary{cursor:pointer;color:var(--sea);font-size:14px}
.chestgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.fragment,.keycard{border:1px dashed var(--line);border-radius:10px;padding:10px 12px;background:var(--panel);min-width:0}
.encport{font-family:var(--f-mono);font-size:20px;letter-spacing:.12em;margin:6px 0;word-break:break-word}
.mirror{display:inline-block;transform:scaleX(-1)}
.halfline{font-style:italic}
.keyname{font-weight:600;font-size:13px}
.keytab td,.keytab th{padding:3px 5px;text-align:center;font-family:var(--f-mono);font-size:12px}
.morsegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:2px 8px;font-size:12px}
.morsegrid code{font-family:var(--f-mono)}
.mirrorcard{border:1px solid var(--line);border-radius:8px;padding:10px;text-align:center;background:linear-gradient(135deg,var(--chip),var(--panel))}
.seal b{font-family:var(--f-display);font-size:20px;color:var(--bad)}
.letter{font-family:var(--f-display);font-size:16px;line-height:1.7}
.ledger td{font-size:14px}
.timeline{padding-left:18px}
.cutlery{font-size:16px;letter-spacing:.06em}
.cutlery.big{font-size:30px;letter-spacing:.2em}
.galleyitems{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.galleyitems > div{border:1px dashed var(--line);border-radius:8px;padding:8px 10px}
.diary p{margin:6px 0}
.envelope{font-size:15px}
.bigletter{font-family:var(--f-display);font-size:44px;color:var(--bad);display:inline-block;margin-left:10px;vertical-align:middle}
.jig{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;max-width:560px}
.jig button{border:2px solid var(--line);border-radius:6px;padding:0;background:var(--panel);color:var(--ink);overflow:hidden}
.jig button.sel{border-color:var(--sea)}
.jig table{font-size:11px}
.jig td,.jig th{height:34px;text-align:center;padding:2px;width:auto}
.jig .reef{background:repeating-linear-gradient(45deg,var(--chip),var(--chip) 4px,var(--line) 4px,var(--line) 8px)}
.jig .isle{color:var(--ok);font-weight:600}
.jig .ship{color:var(--bad);font-weight:600}
.rack{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;max-width:520px}
.rack button{border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);padding:10px 6px;font-size:13px}
.rack button.dust{opacity:.5}
/* market */
.inv{display:flex;flex-wrap:wrap;gap:6px}
.inv span{background:var(--chip);border-radius:8px;padding:3px 9px;font-size:13px}
.inv span b{font-family:var(--f-mono)}
.recipe{border:1px solid var(--brass);border-radius:10px;padding:10px 12px}
.recipe .foot{border-top:1px dashed var(--line);margin-top:8px;padding-top:6px;font-size:13px;color:var(--muted)}
.mk{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px}
/* host */
.board td.cell{text-align:center;white-space:nowrap;cursor:default}
.board td.cell.ok{background:var(--okbg);color:var(--ok)}
.board td.cell.warn{background:var(--warnbg);color:var(--warn)}
.board td.cell.bad{background:var(--badbg);color:var(--bad)}
.board td.cell.can{cursor:pointer}
.board td.cell small{display:block;font-size:10px;color:var(--muted)}
.scorebar{height:10px;border-radius:5px;background:var(--sea)}
.bestmark{outline:2px solid var(--ok);outline-offset:-2px}
.lockbox{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.lockbox input{width:140px;font-family:var(--f-mono)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.rating{display:flex;gap:4px;flex-wrap:wrap}
.rating button{width:34px;height:34px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}
.rating button[aria-pressed="true"]{background:var(--sea);color:var(--panel);border-color:var(--sea)}
.fbgrid{display:grid;gap:10px}
.fbgrid label{font-size:14px;font-weight:600}
.fbgrid .scale{font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@media (max-width:520px){ .brand{font-size:16px} .clock{font-size:18px} }
</style>

<div class="bar"><div class="bar-in">
  <div class="brand"><small id="brandSmall">Feasibility playtest</small><span id="brandTitle">大航海解谜</span></div>

    <button id="vTester" aria-pressed="true" type="button">测试员</button>

</div></div>
<main class="wrap" id="app"></main>

<script>
const DATA = {"games":[{"id":"A","name":{"zh":"五片航海图","en":"The Five Fragments"},"mode":{"zh":"纯合作","en":"Pure cooperation"},"testMinutes":35,"realMinutes":50,"roles":{"1":{"zh":"海鹰号","en":"Sea Hawk"},"2":{"zh":"北极星号","en":"Polaris"},"3":{"zh":"信风号","en":"Trade Wind"},"4":{"zh":"珊瑚号","en":"Coral"},"5":{"zh":"晨星号","en":"Morning Star"}},"roleWord":{"zh":"船","en":"Ship"},"story":{"zh":"1519 年，五艘船准备从里斯本出发寻找香料群岛。老船长临终前把唯一的航海图撕成五片，分别锁进五艘船的船长箱。今晚舰队在港口重新集结，必须在天亮前拼出完整航线。<b>每一片地图都不完整，每一把钥匙都不在它自己的船上。<\/b>","en":"1519: five ships prepare to leave Lisbon for the Spice Islands. The dying Admiral tore the only chart into five pieces and locked one in each captain's chest. Tonight the fleet regroups and must rebuild the route before dawn. <b>No fragment is complete, and no key is on its own ship.<\/b>"},"testNote":{"zh":"测试时一个人代表一整条船。第一幕的三道谜在真实活动里由 5 人并行，所以你的用时会偏长，这正是我们要观察的数据。","en":"In this test one person plays a whole ship. In the real event five people split Act 1, so your times will run long. That is exactly the data we want."},"watch":{"zh":["第一幕谁最先完成、闲了多久","钥匙环有没有造成某条船长时间等待","埃特巴什和镜像字是否太难或太简单","A5 是全员讨论还是一个人拍板"],"en":["Who finishes Act 1 first and how long they sit idle","Whether the key ring leaves one ship waiting","Whether Atbash and mirror writing are too hard or too easy","Whether A5 is a group discussion or one person deciding"]},"puzzles":[{"id":"A1","stage":"intra","target":6,"title":{"zh":"信号旗","en":"Signal flags"},"body":{"1":{"zh":"<p>桅杆上挂着一串旗。对照下方的国际信号旗表，拼出你的第一个数字。<\/p><div class=\"flagrow\" data-flags=\"SIX\"><\/div><details class=\"chart\"><summary>国际信号旗对照表<\/summary><div data-flagchart><\/div><\/details>","en":"<p>A string of flags flies from the mast. Use the signal flag chart below to spell your first number.<\/p><div class=\"flagrow\" data-flags=\"SIX\"><\/div><details class=\"chart\"><summary>International signal flag chart<\/summary><div data-flagchart><\/div><\/details>"},"2":{"zh":"<p>桅杆上挂着一串旗。对照下方的国际信号旗表，拼出你的第一个数字。<\/p><div class=\"flagrow\" data-flags=\"ONE\"><\/div><details class=\"chart\"><summary>国际信号旗对照表<\/summary><div data-flagchart><\/div><\/details>","en":"<p>A string of flags flies from the mast. Use the signal flag chart below to spell your first number.<\/p><div class=\"flagrow\" data-flags=\"ONE\"><\/div><details class=\"chart\"><summary>International signal flag chart<\/summary><div data-flagchart><\/div><\/details>"},"3":{"zh":"<p>桅杆上挂着一串旗。对照下方的国际信号旗表，拼出你的第一个数字。<\/p><div class=\"flagrow\" data-flags=\"NINE\"><\/div><details class=\"chart\"><summary>国际信号旗对照表<\/summary><div data-flagchart><\/div><\/details>","en":"<p>A string of flags flies from the mast. Use the signal flag chart below to spell your first number.<\/p><div class=\"flagrow\" data-flags=\"NINE\"><\/div><details class=\"chart\"><summary>International signal flag chart<\/summary><div data-flagchart><\/div><\/details>"},"4":{"zh":"<p>桅杆上挂着一串旗。对照下方的国际信号旗表，拼出你的第一个数字。<\/p><div class=\"flagrow\" data-flags=\"TWO\"><\/div><details class=\"chart\"><summary>国际信号旗对照表<\/summary><div data-flagchart><\/div><\/details>","en":"<p>A string of flags flies from the mast. Use the signal flag chart below to spell your first number.<\/p><div class=\"flagrow\" data-flags=\"TWO\"><\/div><details class=\"chart\"><summary>International signal flag chart<\/summary><div data-flagchart><\/div><\/details>"},"5":{"zh":"<p>桅杆上挂着一串旗。对照下方的国际信号旗表，拼出你的第一个数字。<\/p><div class=\"flagrow\" data-flags=\"FIVE\"><\/div><details class=\"chart\"><summary>国际信号旗对照表<\/summary><div data-flagchart><\/div><\/details>","en":"<p>A string of flags flies from the mast. Use the signal flag chart below to spell your first number.<\/p><div class=\"flagrow\" data-flags=\"FIVE\"><\/div><details class=\"chart\"><summary>International signal flag chart<\/summary><div data-flagchart><\/div><\/details>"}},"hints":[{"zh":"每面旗代表一个字母。","en":"Each flag stands for one letter."},{"zh":"逐面查表，拼出一个英文单词。","en":"Look each flag up; they spell an English word."},{"zh":"这个单词是一个数字的英文。","en":"The word is a number."}],"gate":{"label":{"zh":"锁的第 1 位数字","en":"Digit 1 of the lock"},"ph":{"zh":"例如 4","en":"e.g. 4"},"numwords":true,"blobs":{"1":["dkJhJ4YVtdp/e6I+iVAzA8GRMwCWNN/PUHtIFGib0X2fTcK1UPUOvHGAsCPacWponEmjM+KD/YLQFQwMqX/nTb2sm4+8Wzdndk1oVwMRaZ6d+A=="],"2":["Za7ULjSzO0wahHD5uvTGr5FpklFM9OEa4o9hy0ctYiolesaHiBbl48LLX+37Yhd+h/mdQCmbAMfQdAxDCt9ge9KXGDZefG7DGT2rreUwGgYB9A=="],"3":["S702Capeb/D9uUnn34JfF7YBxmx8K9tkxFLGeAxJ1I2zbBrpJ9YVrvrQ4peZVciZbYdxfT50v/8uj0oSrZzIwWAUH3BvCN5TdHx5xYtqI8rhLw=="],"4":["+38HFiiD1yXdvDbU6DlBZnfak5aCRVbn//smOLewUVTPXv7VR3KQxdSjPSffv6P9oxXkBe0a3OmdTb6caNfPyoACz0cbrbG4VBByGsUKniG+lA=="],"5":["s2lTaMLVfBK47P2T3+rlR7topH2ZKCrKrwsfS+hBVqnOViRNxQsIZblWnBcHJujYq2B3FgAjcn6w1pMCP+QfS2IotTJBut0DjXseGKJJdTDvlg=="]}}},{"id":"A2","stage":"intra","target":8,"title":{"zh":"船员名册","en":"Crew roster"},"body":{"0":{"zh":"<p>1–4 号铺住着 Pedro、Juan、Diego、Luis，职位分别是领航员、厨师、木匠、炮手（每人一个）。<\/p><ol class=\"clues\"><li>领航员睡在 1 号铺。<\/li><li>厨师的铺号正好比 Juan 大 1。<\/li><li>Luis 睡在最后一个铺位。<\/li><li>Diego 既不是木匠，也不是厨师。<\/li><li>炮手和木匠的铺位不相邻。<\/li><\/ol><p><b>厨师睡在几号铺？这是锁的第 2 位。<\/b><\/p>","en":"<p>Pedro, Juan, Diego and Luis sleep in bunks 1–4. Their jobs are navigator, cook, carpenter and gunner (one each).<\/p><ol class=\"clues\"><li>The navigator sleeps in bunk 1.<\/li><li>The cook's bunk is exactly one higher than Juan's.<\/li><li>Luis sleeps in the last bunk.<\/li><li>Diego is neither the carpenter nor the cook.<\/li><li>The gunner and the carpenter are not in adjacent bunks.<\/li><\/ol><p><b>Which bunk is the cook in? That is digit 2.<\/b><\/p>"}},"hints":[{"zh":"画一张 4×4 表格，先填确定的信息。","en":"Draw a 4×4 grid and fill in what is certain."},{"zh":"从第 3 条和第 1 条入手，再分情况讨论 Diego 的职位。","en":"Start from clues 3 and 1, then test each job for Diego."},{"zh":"Diego 是领航员，Juan 在 2 号铺。","en":"Diego is the navigator; Juan is in bunk 2."}],"gate":{"label":{"zh":"锁的第 2 位数字","en":"Digit 2 of the lock"},"ph":{"zh":"1–4","en":"1–4"},"numwords":true,"blobs":{"0":["o2Yg8+/3mtszVFC3ISU3TbVrqqDm9B6l3/d5Xn5Z1IeeV3rL4 n":"House of the Star"}},"roleWord":{"zh":"商行","en":"House"},"market":true,"story":{"zh":"1520 年代的塞维利亚，香料比黄金还贵。国王宣布：第一个献上“皇家宴会配方”全部香料的商行，将获得下一次远航的特许状。五家商行各控制一种香料的产地，谁也凑不齐自己的配方。<b>交易、结盟、海盗，以及最后的诏书。<\/b>","en":"Seville, 1520s, when spice is worth more than gold. The King promises the next royal charter to the first house that presents every spice in the Royal Banquet Recipe. Each house controls one spice and none can finish its recipe alone. <b>Trades, alliances, pirates, and a final decree.<\/b>"},"testNote":{"zh":"测试时由主持人兼任交易所书记员，银行和事件在主持人视图里操作。香料“货箱”和金币都记在页面上，交易时双方各自点转账。B1 需要一个真实的闻香台（5 个罐子）。","en":"In this test the host doubles as the Exchange clerk; bank and events live in the host view. Crates and coins are tracked on the page: in a trade, each side sends its half. B1 needs one real smell station (5 jars)."},"watch":{"zh":["交易是否真的发生，还是有人囤货","银行和事件是否给主持人带来太大负担","反转（SPICE）时大家的反应","有没有商行因为缺货完全卡死"],"en":["Whether trades actually happen or someone hoards","Whether the bank and events overload the host","How people react to the SPICE twist","Whether any house is stuck for lack of goods"]},"recipes":{"1":["pepper","cinnamon","clove","nutmeg"],"2":["cinnamon","clove","nutmeg","anise"],"3":["clove","nutmeg","anise","pepper"],"4":["nutmeg","anise","pepper","cinnamon"],"5":["anise","pepper","cinnamon","clove"]},"home":{"1":"pepper","2":"cinnamon","3":"clove","4":"nutmeg","5":"anise"},"foreign":{"1":"anise","2":"pepper","3":"cinnamon","4":"clove","5":"nutmeg"},"foot":{"1":{"num":"II","text":{"zh":"不属于","en":"belongs to"},"seal":"P"},"2":{"num":"V","text":{"zh":"所有远航归来的人","en":"all who sailed home"},"seal":"E"},"3":{"num":"IV","text":{"zh":"而属于","en":"but to"},"seal":"C"},"4":{"num":"I","text":{"zh":"国王的宴席","en":"The King's feast"},"seal":"S"},"5":{"num":"III","text":{"zh":"任何一家商行","en":"no single house"},"seal":"I"}},"puzzles":[{"id":"B1","stage":"intra","target":6,"title":{"zh":"闻香辨货","en":"Smell the cargo"},"body":{"0":{"zh":"<p>去闻香台（5 个编号小罐）。根据描述判断每个罐子装的是什么。<\/p><ul class=\"cargo\"><li><b>黑胡椒<\/b>：马拉巴尔海岸的“黑色黄金”，闻一下就想打喷嚏。<\/li><li><b>肉桂<\/b>：锡兰树木的内皮，甜而温暖。<\/li><li><b>丁香<\/b>：摩鹿加群岛的花蕾，像小钉子，闻久了舌头发麻。<\/li><li><b>肉豆蔻<\/b>：班达群岛的果核，味道最“闷”。<\/li><li><b>八角<\/b>：来自中国南方的八角星，带甘草味。<\/li><\/ul>","en":"<p>Go to the smell station (5 numbered jars). Work out what each jar holds.<\/p><ul class=\"cargo\"><li><b>Black pepper<\/b>: the “black gold” of the Malabar Coast; one sniff and you sneeze.<\/li><li><b>Cinnamon<\/b>: Ceylon bark, sweet and warm.<\/li><li><b>Clove<\/b>: a Moluccan flower bud shaped like a nail; it numbs the tongue.<\/li><li><b>Nutmeg<\/b>: a Banda Islands seed, the most “muted” smell.<\/li><li><b>Star anise<\/b>: an eight-pointed star from southern China that smells of liquorice.<\/li><\/ul>"}},"hints":[{"zh":"先找最好认的：八角（甘草味）和肉桂（甜）。","en":"Start with the easy ones: anise (liquorice) and cinnamon (sweet)."},{"zh":"丁香会让鼻子发麻；肉豆蔻最闷。","en":"Clove numbs; nutmeg is the most muted."},{"zh":"1 号罐是肉桂，4 号罐是八角。","en":"Jar 1 is cinnamon and jar 4 is star anise."}],"rewards":{"1":[["pepper",2]],"2":[["cinnamon",2]],"3":[["clove",2]],"4":[["nutmeg",2]],"5":[["anise",2]]},"gate":{"label":{"zh":"按 胡椒·肉桂·丁香·肉豆蔻·八角 的顺序写罐号","en":"Jar numbers in the order pepper·cinnamon·clove·nutmeg·anise"},"ph":"00000","blobs":{"0":["wVrFdBZXWbfrp4fxOo2nGBSBS2TQr9bfAH3xnSOF//CSMf+5WDHbs6kMoQuHWKGE7n6BXXMODXoUzTryz/ebPE2V56O8JgEuZ5859lsKdvHchVToWxXh8Jn2VM9ZzTBlsLMA400k4CHPaJ/epk9yUYTGl1a2veybCfF7Qum/zmT/D4B4yPAByVY="]}}},{"id":"B2","stage":"intra","target":5,"title":{"zh":"罗马数字账簿","en":"Roman-numeral ledger"},"body":{"1":{"zh":"<p>司库偷了钱，还改了账本里的一行。找出被改的是第几行。<\/p><div class=\"tw\"><table class=\"ledger\"><tr><td>I<\/td><td>胡椒<\/td><td class=\"mono\">XII 袋 × III 金币 = XXXVI<\/td><\/tr><tr><td>II<\/td><td>肉桂<\/td><td class=\"mono\">VIII 袋 × V 金币 = XL<\/td><\/tr><tr><td>III<\/td><td>丁香<\/td><td class=\"mono\">XV 袋 × IV 金币 = LX<\/td><\/tr><tr><td>IV<\/td><td>肉豆蔻<\/td><td class=\"mono\">VI 袋 × IX 金币 = LIV<\/td><\/tr><tr><td>V<\/td><td>八角<\/td><td class=\"mono\">X 袋 × VII 金币 = L // ---------------------------------------------------------------- crypto (answers stay encrypted in the source)
const te = new TextEncoder();
async function sha(bytes){ return new Uint8Array(await crypto.subtle.digest("SHA-256", bytes)); }
async function hexHash(s){ return Array.from(await sha(te.encode(s)), b => b.toString(16).padStart(2, "0")).join(""); }
const decCache = new Map();
async function dec(pidc, key, b64){
  const ck = pidc + "|" + key + "|" + b64.slice(0, 24);
  if (decCache.has(ck)) return decCache.get(ck);
  let res = null;
  try {
    const K = await sha(te.encode("aod|" + pidc + "|" + key));
    const bin = atob(b64); const ct = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) ct[i] = bin.charCodeAt(i);
    const out = new Uint8Array(ct.length);
    for (let b = 0; b * 32 < ct.length; b++){
      const blk = new Uint8Array(36); blk.set(K);
      blk[32] = (b >>> 24) & 255; blk[33] = (b >>> 16) & 255; blk[34] = (b >>> 8) & 255; blk[35] = b & 255;
      const ks = await sha(blk);
      for (let j = 0; j < 32 && b * 32 + j < ct.length; j++) out[b*32+j] = ct[b*32+j] ^ ks[j];
    }
    const s = new TextDecoder().decode(out);
    if (s.startsWith("OK|")) res = JSON.parse(s.slice(3));
  } catch(e){ res = null; }
  decCache.set(ck, res);
  return res;
}
const NUMW = {ZERO:"0",ONE:"1",TWO:"2",THREE:"3",FOUR:"4",FIVE:"5",SIX:"6",SEVEN:"7",EIGHT:"8",NINE:"9","零":"0","一":"1","二":"2","三":"3","四":"4","五":"5","六":"6","七":"7","八":"8","九":"9"};
const DIRS = {"→":"R","←":"L","↑":"U","↓":"D","右":"R","左":"L","上":"U","下":"D","东":"R","西":"L","北":"U","南":"D"};
function norm(s, g){
  s = String(s || "").toUpperCase();
  if (g && g.dir) s = s.replace(/[→←↑↓右左上下东西北南]/g, c => DIRS[c]);
  s = s.replace(/[^A-Z0-9一-鿿]/g, "");
  if (g && g.numwords && NUMW[s]) s = NUMW[s];
  if (g && g.aliases && g.aliases[s]) s = g.aliases[s];
  return s;
}

  try { await store.set("ev/" + id, Object.assign({run, game: gid, team, pid, type, ts: Date.now()}, extra || {})); }

async function grantRewards(g, p, team){
  if (!p.rewards) return;
  const run = runOf(g.id).id;
  const targets = p.shared ? Object.keys(p.rewards).map(Number) : [team];
  for (const b of targets){
    for (const [item, qty] of (p.rewards[b] || [])){
      await store.set(`tx/${run}_rw_${p.id}_${b}_${item}`, {run, from: "game", to: b, item, qty, kind: "reward", ts: Date.now()});
    }
  }
}
async function openGate(p, team, key){
  const bt = p.gate.blobs[team] != null ? team : 0;
  for (const b of p.gate.blobs[bt] || []){ const out = await dec(`${p.id}#${bt}`, key, b); if (out) return out; }
  return null;
}
async function trySubmit(g, p, team, raw){
  const gate = p.gate; const key = norm(raw, gate);
  if (!key) return;
  const out = await openGate(p, team, key);
  if (out){
    S.drafts[p.id] = "";
    await logEvent(g.id, team, p.id, "solve", {key});
    await grantRewards(g, p, team);
  } else {
    await logEvent(g.id, team, p.id, "wrong", {});
    flash(p.id, t("wrong"), true);
  }
}

  return openGate(p, team, ev.key);
}

const FC = {R:"var(--flagR)",B:"var(--flagB)",Y:"var(--flagY)",W:"var(--flagW)",K:"var(--flagK)"};

function clockHTML(g){
  const r = runOf(g.id);
  if (!r.startedAt) return `<span class="muted">${t("notStarted")}</span>`;
  const end = r.endedAt || Date.now(); const ms = end - r.startedAt; const over = ms > g.testMinutes * 60000;
  return `<span class="clock ${over ? "over" : ""}" id="clock" data-g="${g.id}">${mmss(ms)}</span> <span class="muted">/ ${g.testMinutes}:00 ${r.endedAt ? "· " + t("ended") : ""}</span>`;
}
function bannerHTML(){
  const b = S.broadcast; if (!b || !b.ts || b.ts <= S.dismissedBc) return "";

}
function hintBlock(g, p, team){
  const used = hintsUsed(g, p, team); const hs = (p.hints || []).filter(h => L(h));
  if (!hs.length) return "";
  const next = used.length < hs.length ? used.length + 1 : 0;
  let h = `<div class="hintrow">`;
  [...used].sort().forEach(l => { h += `<div class="hint"><b>${t("hint")} ${l}</b> · ${esc(L(hs[l-1]))}</div>`; });
  if (next) h += `<button class="btn small" type="button" data-hint="${p.id}" data-level="${next}">${t("hint")} ${next} / ${hs.length}</button>`;
  return h + "</div>";
}
function answerFor(p, team){
  if (!S.sol || !S.sol.keys[p.id]) return null;
  const k = S.sol.keys[p.id]; return k[team] ?? k[0] ?? null;
}
function cardHTML(g, p, team){
  const vis = teamsOf(p).includes(team) || p.envelope;
  if (!vis) return "";
  const req = p.requires ? P(g, p.requires) : null;
  const locked = req && !isSolved(g, req, team);
  const solved = isSolved(g, p, team);
  const ev = p.envelope ? null : solveEvent(g, p, team);
  const time = ev ? elapsedOf(g.id, ev.ts) : null;
  const chips = [`<span class="chip ${p.stage === "cross" ? "cross" : ""}">${t("stage_" + p.stage)}</span>`, `<span class="chip">${t("target")} ${p.target} ${t("min")}</span>`];
  if (solved) chips.push(`<span class="chip ok">✓ ${t("solved")}${time != null ? " " + mmss(time) : ""}</span>`);
  let h = `<article class="card ${solved ? "solved" : ""} ${locked ? "locked" : ""}" id="card-${p.id}"><div class="card-h"><span class="pid">${p.id}</span><h3>${esc(L(p.title))}</h3>${chips.join("")}</div>`;
  if (locked){ return h + `<p class="muted">${t("lockedBy")} ${req.id} · ${esc(L(req.title))}</p></article>`; }
  if (p.shared && teamsOf(p).length > 1) h += `<p class="note">${t("sharedP")}: ${teamsOf(p).map(n => esc(L(g.roles[n]))).join(" · ")}</p>`;

  if (p.envelope){
    h += `<div data-reveal="${p.id}">${solved ? "" : `<p class="muted">${t("waitingEnv")}</p>`}</div>`;
    return h + "</article>";

  if (p.gate && !solved && !p.choice){
    const g2 = p.gate; const val = S.drafts[p.id] || "";
    h += `<form class="gate" data-gate="${p.id}"><label for="in-${p.id}">${esc(L(g2.label))}</label><input id="in-${p.id}" autocomplete="off" spellcheck="false" placeholder="${esc(L(g2.ph))}" value="${esc(val)}"><button class="btn primary" type="submit">${t("submit")}</button></form>`;

}

function cellClass(g, p, team){
  if (!teamsOf(p).includes(team) && !p.envelope) return {cls:"", txt:""};
  const ev = p.envelope ? solveEvent(g, P(g, p.from), 5) : solveEvent(g, p, team);
  const hs = hintsUsed(g, p, team).length; const w = wrongCount(g, p, team);
  const extra = (hs || w) ? `<small>${hs ? "H" + hs : ""}${hs && w ? " " : ""}${w ? "✕" + w : ""}</small>` : "";
  if (!ev) return {cls: "", txt: "·" + extra, open: true};
  const ms = elapsedOf(g.id, ev.ts); if (ms == null) return {cls:"ok", txt:"✓" + extra};
  const ratio = ms / (p.target * 60000);
  // targets are per puzzle; the comparison uses the cumulative clock, so scale by the sum of targets up to this puzzle
  const cum = g.puzzles.slice(0, g.puzzles.indexOf(p) + 1).filter(q => teamsOf(q).includes(team) || q.envelope).reduce((a, q) => a + q.target, 0) * 60000;
  const r2 = ms / cum;
  return {cls: r2 <= 1 ? "ok" : r2 <= 1.5 ? "warn" : "bad", txt: mmss(ms) + extra};
}

function gameStats(g){
  const fbs = [1,2,3,4,5].map(n => S.fb[`${g.id}_${n}`]).filter(Boolean);
  const avg = f => { const v = fbs.map(x => Number(x[f])).filter(n => n > 0); return v.length ? v.reduce((a,b) => a+b, 0) / v.length : null; };
  const evs = evRun(g.id);
  const finale = g.puzzles.filter(p => p.stage === "final" && !p.envelope).pop();
  const fe = finale ? evs.filter(e => e.type === "solve" && e.pid === finale.id).sort((a,b) => a.ts - b.ts)[0] : null;
  const ftime = fe ? elapsedOf(g.id, fe.ts) : null;
  const inTime = ftime != null && ftime <= g.testMinutes * 60000;
  const s = {n: fbs.length, diff: avg("difficulty"), inter: avg("interactivity"), fun: avg("fun"), clar: avg("clarity"), idle: avg("idle"), realIdle: avg("realIdle"),
    hints: evs.filter(e => e.type === "hint").length, wrong: evs.filter(e => e.type === "wrong").length, ftime, inTime, fbs};
  s.score = (s.inter == null) ? null : s.inter * 2 + (s.fun || 0) + (s.clar || 0) * 0.5 - Math.abs((s.diff || 3) - 3) * 2 + (inTime ? 1 : 0);
  return s;
}

  });
  if (!stats.some(([,s]) => s.n)) h += `<p class="muted">${t("noData")}</p>`;

    `<button class="btn warn" type="button" data-act="bcPirate" ${S.isOwner ? "" : "disabled"}>${t("pirates")}</button>` +
    `<button class="btn" type="button" data-mk="closed" ${S.isOwner ? "" : "disabled"}>${S.market.closed ? t("reopenMk") : t("closeMk")}</button></div>`;
  h += `<p class="note">${t("bank")} · ${t("price")} ${bankPrice()} · ${t("stock")} ${Math.max(0, 3 - bankSold())}</p><div class="tw"><table><tr><th>${t("team")}</th>` +
    ITEMS.map(it => `<th>${esc(L(DATA.itemNames[it]))}</th>`).join("") + `<th>${t("pass")}</th><th>${t("recipeCard")}</th><th>${t("score")}</th></tr>`;
  [1,2,3,4,5].forEach(n => {
    const st = recipeStatus(n); const inv = st.inv;
    h += `<tr><td>${n} ${esc(L(g.roles[n]))}</td>` + ITEMS.map(it => `<td>${inv[it] || 0}</td>`).join("") + `<td>${inv.pass ? "✓" : ""}</td><td>${st.complete ? "✓" : t("missing") + " " + st.miss.length}</td><td><b>${(st.complete ? 10 : 0) + inv.coins}</b></td></tr>`;
  });
  return h + "</table></div></section>";
}
function broadcastBox(){
  return `<section class="panel stack"><h3>${t("broadcast")}</h3><form class="row" data-act="bcCustom"><input id="bc-text" style="flex:1 1 220px" value="${esc(S.drafts["bc-text"] || "")}" placeholder="${t("custom")}"><button class="btn primary" type="submit" ${S.isOwner ? "" : "disabled"}>${t("sendBc")}</button><button class="btn" type="button" data-act="bcClear" ${S.isOwner ? "" : "disabled"}>${t("clearBc")}</button></form>` +
    (S.broadcast && S.broadcast.ts ? `<p class="note">${esc(L(S.broadcast.text))}</p>` : "") + `</section>`;
}
function protocolBox(){
  const P2 = DATA.protocol;
  let h = `<section class="panel stack"><h3>${t("protocol")}</h3>${L(P2.schedule)}<h4>${t("prep")}</h4>${L(P2.prep)}<h4>${t("watch")}</h4><div class="tw"><table><tr>` +
    DATA.games.map(g => `<th>${g.id} · ${esc(L(g.name))}</th>`).join("") + "</tr><tr>" +
    DATA.games.map(g => `<td><ul>${L(g.watch).map(w => `<li>${esc(w)}</li>`).join("")}</ul></td>`).join("") + "</tr></table></div>";
  h += `<h4>${t("notes")}</h4><form class="stack" data-act="notes"><textarea id="notes-text">${esc(S.drafts["notes-text"] ?? (S.notes.text || ""))}</textarea><div class="row"><button class="btn" type="submit" ${S.isOwner ? "" : "disabled"}>${t("saveNotes")}</button></div></form>`;
  return h + "</section>";
}
function solutionsBox(){
  let h = `<section class="panel stack"><h3>${t("solutions")}</h3>`;
  if (!answersVisible()) return h + `<p class="muted">${t("lockedAnswers")}</p></section>`;
  DATA.games.forEach(g => { h += `<h4>${g.id} · ${esc(L(g.name))}</h4><div class="tw">${L(S.sol.games[g.id])}</div>`; });
  return h + "</section>";
}
function hostView(){
  return `<div class="stack"><h1>${t("hostTitle")}</h1>${bannerHTML()}${lockBox()}${sessionBox()}${boardBox()}${resultsBox()}${marketHostBox()}${broadcastBox()}${protocolBox()}${solutionsBox()}</div>`;
}

// ---------------------------------------------------------------- render
async function fillReveals(root){
  if (S.view !== "tester" || !S.team) return;
  const g = G(S.game);
  for (const el of root.querySelectorAll("[data-reveal]")){
    const p = P(g, el.dataset.reveal); if (!isSolved(g, p, S.team)) continue;
    const r = await revealFor(g, p, S.team);
    if (r && el.isConnected) el.innerHTML = L(r);
  }
}
function render(){
  document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
  document.getElementById("brandSmall").textContent = t("brandSmall");
  document.getElementById("brandTitle").textContent = t("brand");
  document.getElementById("vTester").textContent = t("tester"); document.getElementById("vHost").textContent = t("host");
  document.getElementById("vTester").setAttribute("aria-pressed", S.view === "tester"); document.getElementById("vHost").setAttribute("aria-pressed", S.view === "host");
  document.getElementById("lZh").setAttribute("aria-pressed", lang === "zh"); document.getElementById("lEn").setAttribute("aria-pressed", lang === "en");
  const sy = document.getElementById("sync"); sy.classList.toggle("on", S.mode === "shared"); document.getElementById("syncText").textContent = S.mode === "shared" ? t("shared") : t("local");
  const app = document.getElementById("app");
  keepFocus(() => { app.innerHTML = S.view === "host" ? hostView() : testerView(); });
  hydrate(app);
  if (S.view === "tester" && S.team){
    const g = G(S.game);
    const jw = app.querySelector("[data-jigwrap]"); if (jw) jw.innerHTML = jigsawHTML(g, S.team);
    app.querySelectorAll("[data-rackwrap]").forEach(el => { el.innerHTML = rackHTML(g, P(g, el.dataset.rackwrap), S.team); });
  }
  fillReveals(app);
}
setInterval(() => {
  const c = document.getElementById("clock"); if (c){ const g = G(c.dataset.g); const r = runOf(g.id); if (r.startedAt && !r.endedAt){ const ms = Date.now() - r.startedAt; c.textContent = mmss(ms); c.classList.toggle("over", ms > g.testMinutes * 60000); } }
  if (S.view === "host" && S.session.current && runOf(S.session.current).startedAt && !runOf(S.session.current).endedAt && !document.activeElement?.matches("input,textarea,select")) schedule();
}, 1000);

// ---------------------------------------------------------------- events
document.getElementById("vTester").onclick = () => { S.view = "tester"; LS.set("view", "tester"); render(); };
document.getElementById("vHost").onclick = () => { S.view = "host"; LS.set("view", "host"); render(); };
document.getElementById("lZh").onclick = () => { lang = "zh"; LS.set("lang", lang); render(); };
document.getElementById("lEn").onclick = () => { lang = "en"; LS.set("lang", lang); render(); };
const app = document.getElementById("app");
app.addEventListener("input", e => {
  const el = e.target;
  if (el.id && el.id.startsWith("in-")) S.drafts[el.id.slice(3)] = el.value;
  else if (el.dataset.fbf){ const f = el.closest("form"); S.drafts["fb_" + f.dataset.fbid][el.dataset.fbf] = el.value; }
  else if (el.id) S.drafts[el.id] = el.value;
});
app.addEventListener("change", e => {
  const el = e.target;
  if (el.dataset.fbf){ const f = el.closest("form"); S.drafts["fb_" + f.dataset.fbid][el.dataset.fbf] = el.value; }
  else if (el.id) S.drafts[el.id] = el.value;
});
app.addEventListener("submit", async e => {
  e.preventDefault();
  const f = e.target;
  if (f.dataset.gate){ const g = G(S.game); const p = P(g, f.dataset.gate); const v = f.querySelector("input").value; await trySubmit(g, p, S.team, v); return; }
  const act = f.dataset.act;
  if (act === "unlock"){
    const v = norm(f.querySelector("input").value); const ksol = await hexHash("aod-sol|" + v); const sol = await dec("SOL#0", ksol, DATA.sol);
    if (sol){
      S.solKey = ksol; LS.set("solKey", ksol); S.drafts.pw = ""; S.sol = sol;
      if (SB){ hostToken = await hexHash("aod-host|" + v); LS.set("hostToken", hostToken); S.isOwner = true; }
      render();
    } else flash("pw", t("pwBad"), true);
  } else if (act === "fb"){
    const id = f.dataset.fbid; const d = S.drafts["fb_" + id] || {}; const [gid, team] = id.split("_");
    await store.set("fb/" + id, Object.assign({}, d, {game: gid, team: Number(team), ts: Date.now()}));
  } else if (act === "transfer"){
    const to = Number(document.getElementById("tf-to").value); const item = document.getElementById("tf-item").value; const qty = Math.max(1, parseInt(document.getElementById("tf-qty").value, 10) || 1);
    const inv = inventory(S.team);
    if ((inv[item] || 0) < qty){ flash("market", t("notEnough"), true); return; }
    await txPair({run: runOf("B").id, from: S.team, to, item, qty, kind: "trade", ts: Date.now()});
  } else if (act === "bcCustom"){
    const v = document.getElementById("bc-text").value.trim(); if (!v) return;
    await store.set("control/broadcast", {text: {zh: v, en: v}, ts: Date.now()}); S.drafts["bc-text"] = "";
  } else if (act === "notes"){
    await store.set("control/notes", {text: document.getElementById("notes-text").value, ts: Date.now()});
  }
});
app.addEventListener("click", async e => {
  const b = e.target.closest("button, td[data-mark]"); if (!b) return;
  const d = b.dataset;
  if (d.team){ S.team = Number(d.team); LS.set("team", S.team); render(); return; }
  if (d.game){ S.game = d.game; LS.set("game", d.game); render(); window.scrollTo({top:0}); return; }
  if (d.hint){ await logEvent(S.game, S.team, d.hint, "hint", {level: Number(d.level)}); return; }
  if (d.jig != null && d.jig !== undefined && b.closest(".jig")){ await jigClick(Number(d.jig)); return; }
  if (d.rack){
    const g = G("C"); const p = P(g, "C5a");
    const out = await openGate(p, S.team, d.rack.toUpperCase());
    if (out){ await logEvent("C", S.team, "C5a", "solve", {key: d.rack.toUpperCase()}); }
    else { const k = "dust_" + runOf("C").id; const dust = LS.get(k, []); if (!dust.includes(d.rack)) dust.push(d.rack); LS.set(k, dust); await logEvent("C", S.team, "C5a", "wrong", {}); flash("C5a", t("dust"), true); }
    return;
  }
  if (d.fb){ const f = b.closest("form"); S.drafts["fb_" + f.dataset.fbid][d.fb] = Number(d.v); render(); return; }
  if (d.start){
    const gid = d.start; const runs = Object.assign({}, S.session.runs || {}); runs[gid] = {id: gid + "-" + Date.now(), startedAt: Date.now()};
    await store.set("control/session", {runs, current: gid}); return;
  }
  if (d.end){ const gid = d.end; const runs = Object.assign({}, S.session.runs || {}); runs[gid] = Object.assign({}, runs[gid], {endedAt: Date.now()}); await store.set("control/session", {runs, current: S.session.current}); return; }
  if (d.mark){ S.confirm = d.mark; render(); return; }
  if (d.mk){ const m = Object.assign({}, S.market); m[d.mk] = !m[d.mk]; await store.set("control/market", m);
    if (d.mk === "monsoon" && m.monsoon) await store.set("control/broadcast", {text: DATA.events.monsoon, ts: Date.now()});
    if (d.mk === "embargo" && m.embargo) await store.set("control/broadcast", {text: DATA.events.embargo, ts: Date.now()});
    if (d.mk === "closed" && m.closed) await store.set("control/broadcast", {text: DATA.events.closed, ts: Date.now()});
    return; }
  const act = d.act;
  if (act === "changeTeam"){ S.team = 0; LS.set("team", 0); render(); }
  else if (act === "dismissBc"){ S.dismissedBc = S.broadcast.ts; LS.set("dismissedBc", S.dismissedBc); render(); }
  else if (act === "revealAll"){ await store.set("control/reveal", {open: true, key: S.solKey, ts: Date.now()}); }
  else if (act === "hideAll"){ await store.set("control/reveal", {open: false, ts: Date.now()}); }
  else if (act === "markNo"){ S.confirm = null; render(); }
  else if (act === "markYes"){
    const [gid, pid, team] = S.confirm.split("|"); S.confirm = null; const g = G(gid); const p = P(g, pid); const tn = Number(team);
    const k = S.sol.keys[pid]; const key = p.jigsaw ? "MAP" : (k[tn] ?? k[0]);
    await logEvent(gid, tn, pid, "solve", {key, by: "host"}); await grantRewards(g, p, tn); render();
  }
  else if (act === "bcPirate"){ await store.set("control/broadcast", {text: DATA.events.pirates, ts: Date.now()}); }
  else if (act === "bcClear"){ await store.set("control/broadcast", {text: "", ts: 0}); }
  else if (act === "buy" || act === "sell" || act === "pirate"){
    const item = document.getElementById("bk-item").value; const inv = inventory(S.team); const run = runOf("B").id; const ts = Date.now();
    if (act === "buy"){
      if (S.market.embargo && item === "nutmeg"){ flash("market", t("embargo"), true); return; }
      if (3 - bankSold() <= 0 || inv.coins < bankPrice()){ flash("market", t("notEnough"), true); return; }
      await txPair({run, from: S.team, to: "bank", item: "coins", qty: bankPrice(), kind: "bankbuy", ts}, {run, from: "bank", to: S.team, item, qty: 1, kind: "bankbuy", ts});
    } else if (act === "sell"){
      if ((inv[item] || 0) < 1){ flash("market", t("notEnough"), true); return; }
      await txPair({run, from: S.team, to: "bank", item, qty: 1, kind: "banksell", ts}, {run, from: "bank", to: S.team, item: "coins", qty: 2, kind: "banksell", ts});
    } else {
      if ((inv[item] || 0) < 1){ flash("market", t("notEnough"), true); return; }
      await txPair({run, from: S.team, to: "bank", item, qty: 1, kind: "pirate", ts});
    }
  }
});

boot();
})();
</script>
