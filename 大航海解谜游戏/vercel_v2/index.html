<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>五片航海图 v2 测试</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Young+Serif&display=swap">
<style>
/* Layout: chart-room console. Sticky bridge bar; one reading column; puzzle cards grouped by act; the host console stacks panels by what the host touches most during a run. */
:root{
  --paper:#edf1ee; --panel:#f9fbf8; --ink:#13233a; --muted:#56657a; --line:#d0d8d3; --chip:#e1e8e4;
  --brass:#9a6b17; --sea:#1d5b6a; --ok:#2b7a4b; --warn:#a8660f; --bad:#ad3528; --okbg:#e2f1e7; --warnbg:#f8ecd6; --badbg:#f6e1dd;
  --f-display:"Young Serif", Georgia, "Songti SC", "Noto Serif SC", serif;
  --f-body:"IBM Plex Sans", "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Consolas, monospace;
  --flagR:#c8102e; --flagB:#0b3d91; --flagY:#ffcd00; --flagW:#ffffff; --flagK:#111111; --starInk:#13233a;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#0e1620; --panel:#152130; --ink:#e4ebf1; --muted:#9aa9b9; --line:#25364a; --chip:#1c2b3c;
  --brass:#d7a64a; --sea:#6ab7c7; --ok:#62c48d; --warn:#e3a54c; --bad:#ec7f71; --okbg:#173326; --warnbg:#3a2c14; --badbg:#3c1f1b; --starInk:#ffd98a; color-scheme:dark } }
:root[data-theme="dark"]{
  --paper:#0e1620; --panel:#152130; --ink:#e4ebf1; --muted:#9aa9b9; --line:#25364a; --chip:#1c2b3c;
  --brass:#d7a64a; --sea:#6ab7c7; --ok:#62c48d; --warn:#e3a54c; --bad:#ec7f71; --okbg:#173326; --warnbg:#3a2c14; --badbg:#3c1f1b; --starInk:#ffd98a; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:15px/1.65 var(--f-body);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--panel);border-bottom:1px solid var(--line)}
.bar-in,.wrap{max-width:960px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar-in{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding-block:10px}
.brand{font-family:var(--f-display);font-size:18px;margin-right:auto;line-height:1.2}
.brand small{display:block;font:500 11px var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--brass)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{font:inherit;font-size:13px;border:0;background:transparent;color:var(--ink);padding:5px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.sync{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--warn);display:inline-block}
.sync.on i{background:var(--ok)}
.wrap{padding-block:20px 80px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0}
h1{font-size:clamp(23px,4vw,30px);line-height:1.2}
h2{font-size:21px;margin:26px 0 10px}
h3{font-size:17px}
h4{margin:12px 0 6px;font-size:14px}
p{margin:6px 0}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--sea);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:6px 12px;font-size:14px}
.btn.primary{background:var(--sea);border-color:var(--sea);color:var(--panel)}
.btn.warn{border-color:var(--warn);color:var(--warn)}
.btn.small{padding:3px 9px;font-size:13px}
.btn[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--panel)}
.btn:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;min-width:0}
textarea{width:100%;min-height:64px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.muted,.note{color:var(--muted);font-size:13px}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--brass);font-weight:600;margin:0 0 4px}
.mono{font-family:var(--f-mono)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
th{background:var(--chip);font-weight:600}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.stack{display:grid;gap:12px}
.clock{font-family:var(--f-mono);font-size:22px}
.clock.over{color:var(--bad)}
.live{color:var(--ok);font-weight:600}
.story{border-left:3px solid var(--brass);padding-left:14px}
.banner{background:var(--warnbg);border:1px solid var(--warn);border-radius:10px;padding:10px 14px;display:flex;gap:10px;align-items:flex-start}
.act{display:flex;align-items:baseline;gap:10px;margin:24px 0 8px}
.act h3{font-size:18px}
.act .rule{flex:1;border-top:1px solid var(--line)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:8px;min-width:0}
.card.solved{border-color:var(--ok)}
.card.locked{opacity:.7}
.card-h{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.card-h h3{margin-right:auto}
.pid{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.chip{font-size:12px;border-radius:999px;padding:1px 9px;background:var(--chip);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--okbg);color:var(--ok)}
.chip.warn{background:var(--warnbg);color:var(--warn)}
.chip.bad{background:var(--badbg);color:var(--bad)}
.chip.cross{color:var(--sea)}
.gate{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.gate label{font-size:13px;color:var(--muted);width:100%}
.gate input{flex:1 1 160px;font-family:var(--f-mono);letter-spacing:.06em;text-transform:uppercase}
.msg{font-size:13px}.msg.bad{color:var(--bad)}
.reveal{background:var(--okbg);border-radius:8px;padding:10px 12px}
.hintrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.hint{background:var(--chip);border-radius:8px;padding:6px 10px;font-size:14px}
.answer{background:var(--warnbg);border-radius:8px;padding:8px 12px;font-size:14px}
.teampick{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.teampick button{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:12px;padding:14px;text-align:left;border-left:6px solid var(--c)}
.teampick button b{font-family:var(--f-display);font-weight:400;font-size:20px;display:block}
.teampick button span{display:block;font-size:12px;color:var(--muted)}
.shipdot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);vertical-align:middle;margin-right:6px;border:1px solid var(--line)}
.coins{font-family:var(--f-mono);font-size:20px;color:var(--brass)}
/* puzzle content */
.clues{padding-left:20px;margin:4px 0}
.logline{font-family:var(--f-mono);background:var(--chip);border-radius:6px;padding:6px 10px;display:inline-block}
.flagrow{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}
.flagrow svg{width:56px;height:56px}
.flagchart{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px;margin-top:8px}
.flagchart figure{margin:0;text-align:center;font-family:var(--f-mono);font-size:12px}
.flagchart svg{width:40px;height:40px;display:block;margin:0 auto 2px}
details.chart summary{cursor:pointer;color:var(--sea);font-size:14px}
.chestgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.fragment,.keycard{border:1px dashed var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.encport{font-family:var(--f-mono);font-size:20px;letter-spacing:.12em;margin:6px 0;word-break:break-word}
.halfline{font-style:italic}
.keyname{font-weight:600;font-size:13px}
.keytab td,.keytab th{padding:3px 5px;text-align:center;font-family:var(--f-mono);font-size:12px}
.morsegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:2px 8px;font-size:12px}
.morsegrid code{font-family:var(--f-mono)}
.letter{font-family:var(--f-display);font-size:16px;line-height:1.7}
.ports{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.port{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:4px}
.port.done{border-color:var(--ok);background:var(--okbg)}
.port .stamp{font-family:var(--f-display);font-size:28px;color:var(--bad);line-height:1}
.port .step{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.quizq{font-family:var(--f-display);font-size:19px}
.btn.buzz{font-size:22px;padding:14px 28px;border-radius:14px;width:100%;max-width:360px}
.starbox{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.starbox .q{width:min(220px,70vw)}.starbox .q svg,.joined svg{width:100%;height:auto;display:block}
.joined{display:grid;grid-template-columns:1fr 1fr;width:min(440px,86vw);border-radius:6px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.bottles{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.bottle{border:1px dashed var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:6px}
.bottle.won{border-style:solid;border-color:var(--ok)}
/* host */
.board td.cell{text-align:center;white-space:nowrap}
.board td.cell.ok{background:var(--okbg);color:var(--ok)}
.board td.cell.warn{background:var(--warnbg);color:var(--warn)}
.board td.cell.bad{background:var(--badbg);color:var(--bad)}
.board td.cell small{display:block;font-size:10px;color:var(--muted)}
.pm td{text-align:center}
.lockbox{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.lockbox input{width:140px;font-family:var(--f-mono)}
.rating{display:flex;gap:4px;flex-wrap:wrap}
.rating button{width:34px;height:34px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}
.rating button[aria-pressed="true"]{background:var(--sea);color:var(--panel);border-color:var(--sea)}
.fbgrid{display:grid;gap:10px}
.fbgrid label{font-size:14px;font-weight:600}
.scale{font-size:12px;color:var(--muted)}
.scorebar{height:8px;border-radius:4px;background:var(--brass)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

</div></div>
<main class="wrap" id="app"></main>

ch ship agrees a rallying cry and writes it below. After the video, the four ships shout theirs in turn: that is the signal to set sail. No more chanting after that.<\/p>"}}},{"id":"A1","stage":"intra","target":6,"title":{"zh":"信号旗","en":"Signal flags"},"body":{"1":{"zh":"<p>桅杆上挂着一串旗。对照信号旗表，拼出锁的第 1 位数字。<\/p><div class=\"flagrow\" data-flags=\"SIX\"><\/div><details class=\"chart\"><summary>国际信号旗对照表<\/summary><div data-flagchart><\/div><\/details>","en":"<p>A string of flags flies from the mast. Use the chart to spell digit 1 of the lock.<\/p><div class=\"flagrow\" data-flags=\"SIX\"><\/div><details class=\"chart\"><summary>International signal flag chart<\/summary><div data-flagchart><\/div><\/details>"},"2":{"zh":"<p>桅杆上挂着一串旗。对照信号旗表，拼出锁的第 1 位数字。<\/p><div class=\"flagrow\" data-flags=\"ONE\"><\/div><details class=\"chart\"><summary>国际信号旗对照表<\/summary><div data-flagchart><\/div><\/details>","en":"<p>A string of flags flies from the mast. Use the chart to spell digit 1 of the lock.<\/p><div class=\"flagrow\" data-flags=\"ONE\"><\/div><details class=\"chart\"><summary>International signal flag chart<\/summary><div data-flagchart><\/div><\/details>"},"3":{"zh":"<p>桅杆上挂着一串旗。对照信号旗表，拼出锁的第 1 位数字。<\/p><div class=\"flagrow\" data-flags=\"NINE\"><\/div><details class=\"chart\"><summary>国际信号旗对照表<\/summary><div data-flagchart><\/div><\/details>","en":"<p>A string of flags flies from the mast. Use the chart to spell digit 1 of the lock.<\/p><div class=\"flagrow\" data-flags=\"NINE\"><\/div><details class=\"chart\"><summary>International signal flag chart<\/summary><div data-flagchart><\/div><\/details>"},"4":{"zh":"<p>桅杆上挂着一串旗。对照信号旗表，拼出锁的第 1 位数字。<\/p><div class=\"flagrow\" data-flags=\"TWO\"><\/div><details class=\"chart\"><summary>国际信号旗对照表<\/summary><div data-flagchart><\/div><\/details>","en":"<p>A string of flags flies from the mast. Use the chart to spell digit 1 of the lock.<\/p><div class=\"flagrow\" data-flags=\"TWO\"><\/div><details class=\"chart\"><summary>International signal flag chart<\/summary><div data-flagchart><\/div><\/details>"}},"hints":[{"zh":"每面旗代表一个字母。","en":"Each flag is one letter."},{"zh":"拼出来是一个英文单词。","en":"They spell an English word."},{"zh":"这个单词是一个数字。","en":"The word is a number."}],"gate":{"label":{"zh":"锁的第 1 位","en":"Digit 1"},"ph":"0–9","numwords":true,"blobs":{"1":["dkJhJ4YVtdp/e6I+iVAzA82tPQCWNN/PUHtIFGib0X2fTcK1UPUOvHGAsCPacWponEmjM+KD/YLQFQwMqX/nTb2sm4+8Wzdndk1oVwMRaZ6d+A=="],"2":["Za7ULjSzO0wahHD5uvTGr51VnFFM9OEa4o9hy0ctYiolesaHiBbl48LLX+37Yhd+h/mdQCmbAMfQdAxDCt9ge9KXGDZefG7DGT2rreUwGgYB9A=="],"3":["S702Capeb/D9uUnn34JfF7o9yGx8K9tkxFLGeAxJ1I2zbBrpJ9YVrvrQ4peZVciZbYdxfT50v/8uj0oSrZzIwWAUH3BvCN5TdHx5xYtqI8rhLw=="],"4":["+38HFiiD1yXdvDbU6DlBZnvmnZaCRVbn//smOLewUVTPXv7VR3KQxdSjPSffv6P9oxXkBe0a3OmdTb6caNfPyoACz0cbrbG4VBByGsUKniG+lA=="]}}},{"id":"A2","stage":"intra","target":8,"title":{"zh":"船员名册","en":"Crew roster"},"body":{"0":{"zh":"<p>1–4 号铺住着 Pedro、Juan、Diego、Luis，职位是领航员、厨师、木匠、炮手（每人一个）。<\/p><ol class=\"clues\"><li>领航员睡在 1 号铺。<\/li><li>厨师的铺号正好比 Juan 大 1。<\/li><li>Luis 睡在最后一个铺位。<\/li><li>Diego 既不是木匠，也不是厨师。<\/li><li>炮手和木匠的铺位不相邻。<\/li><\/ol><p><b>厨师睡几号铺？这是第 2 位。<\/b><\/p>","en":"<p>Pedro, Juan, Diego and Luis sleep in bunks 1–4 as navigator, cook, carpenter and gunner (one each).<\/p><ol class=\"clues\"><li>The navigator sleeps in bunk 1.<\/li><li>The cook's bunk is exactly one higher than Juan's.<\/li><li>Luis sleeps in the last bunk.<\/li><li>Diego is neither the carpenter nor the cook.<\/li><li>The gunner and the carpenter are not in adjacent bunks.<\/li><\/ol><p><b>Which bunk is the cook in? That's digit 2.<\/b><\/p>"}},"hints":[{"zh":"画一张 4×4 表格。","en":"Draw a 4×4 grid."},{"zh":"从第 3 条和第 1 条入手，再讨论 Diego。","en":"Start with clues 3 and 1, then test Diego."},{"zh":"Diego 是领航员。","en":"Diego is the navigator."}],"gate":{"label":{"zh":"锁的第 2 位","en":"Digit 2"},"ph":"1–4","numwords":true,"blobs":{"0":["o2Yg8+/3mtszVFC3ISU3TblXpKDm9B6l3/d5Xn5Z1IeeV3rL4kvIDts53oR9YbaXs26L1vFAkRaHQtcFLENy/4vWUJDR0utOZx3lp8eEl/JIvw=="]}}},{"id":"A3","stage":"intra","target":5,"title":{"zh":"罗盘转向","en":"Compass turns"},"body":{"1":{"zh":"<p>罗盘：北=1 东北=2 东=3 东南=4 南=5 西南=6 西=7 西北=8。船头朝北出发，日志写着：<\/p><p class=\"logline\">右转 90° → 右转 45° → 左转 180°<\/p><p>最终朝向的数字是第 3 位。<\/p>","en":"<p>Compass: N=1 NE=2 E=3 SE=4 S=5 SW=6 W=7 NW=8. The bow starts north; the log reads:<\/p><p class=\"logline\">Right 90° → Right 45° → Left 180°<\/p><p>The final heading’s digit is digit 3.<\/p>"},"2":{"zh":"<p>罗盘：北=1 东北=2 东=3 东南=4 南=5 西南=6 西=7 西北=8。船头朝北出发，日志写着：<\/p><p class=\"logline\">左转 45° → 左转 90° → 右转 45°<\/p><p>最终朝向的数字是第 3 位。<\/p>","en":"<p>Compass: N=1 NE=2 E=3 SE=4 S=5 SW=6 W=7 NW=8. The bow starts north; the log reads:<\/p><p class=\"logline\">Left 45° → Left 90° → Right 45°<\/p><p>The final heading’s digit is digit 3.<\/p>"},"3":{"zh":"<p>罗盘：北=1 东北=2 东=3 东南=4 南=5 西南=6 西=7 西北=8。船头朝北出发，日志写着：<\/p><p class=\"logline\">右转 135° → 左转 45° → 右转 90°<\/p><p>最终朝向的数字是第 3 位。<\/p>","en":"<p>Compass: N=1 NE=2 E=3 SE=4 S=5 SW=6 W=7 NW=8. The bow starts north; the log reads:<\/p><p class=\"logline\">Right 135° → Left 45° → Right 90°<\/p><p>The final heading’s digit is digit 3.<\/p>"},"4":{"zh":"<p>罗盘：北=1 东北=2 东=3 东南=4 南=5 西南=6 西=7 西北=8。船头朝北出发，日志写着：<\/p><p class=\"logline\">右转 180° → 左转 45° → 左转 90°<\/p><p>最终朝向的数字是第 3 位。<\/p>","en":"<p>Compass: N=1 NE=2 E=3 SE=4 S=5 SW=6 W=7 NW=8. The bow starts north; the log reads:<\/p><p class=\"logline\">Right 180° → Left 45° → Left 90°<\/p><p>The final heading’s digit is digit 3.<\/p>"}},"hints":[{"zh":"站起来真的转一转。","en":"Stand up and turn."},{"zh":"右转是顺时针，45° 是一格。","en":"Right is clockwise; 45° is one step."},{"zh":"把每一步的朝向写下来。","en":"Write down each heading."}],"gate":{"label":{"zh":"锁的第 3 位","en":"Digit 3"},"ph":"1–8","numwords":true,"blobs":{"1":["78imizueYIS5jT9TGi4XSf7seczL4aJCaUt6vX/Xu9nBQBouGz0rH4Ud2sbb09GOjl7d0J42+8klJLvVVccF4yGh/nAMNPiYqUHBQm5c9Q3m/Q=="],"2":["gsNXIpYJ2CTNpPWvqKH4xvbIVW64Bs/rqmEYAldqNKCCRuV4Li0YN4Kx46FiPfPmFf6dmFaHXtr++tkwCrVWeC2f6ZkLIvvyrex1CC5ZHz/gRA=="],"3":["pPlp5 4–6 have washed ashore."},"stars":{"zh":"乌云散了。把你们的夜航星图卡放上桌，拼在一起。","en":"The clouds have parted. Bring your night-chart cards to the table and join them."}},"protocol":{"schedule":{"zh":"<div class=\"tw\"><table><tr><th>时间<\/th><th>内容<\/th><th>主持人<\/th><\/tr><tr><td>0:00–0:10<\/td><td>说明测试目的；4 位测试员各自打开页面，选 1–4 号船<\/td><td>确认右上角显示“已同步”；准备港口道具<\/td><\/tr><tr><td>0:10–1:10<\/td><td><b>完整跑一遍 60 分钟<\/b><\/td><td>点“开始”，四船喊口号；16′ 放第一批漂流瓶，30′ 放第二批，34′ 广播暴风雨并开抢答<\/td><\/tr><tr><td>1:10–1:20<\/td><td>每人填反馈<\/td><td>点“结束”<\/td><\/tr><tr><td>1:20–1:40<\/td><td>看结果、公开答案、复盘<\/td><td>重点讨论港口巡航用时和金币是否平衡<\/td><\/tr><\/table><\/div>","en":"<div class=\"tw\"><table><tr><th>Time<\/th><th>What<\/th><th>Host<\/th><\/tr><tr><td>0:00–0:10<\/td><td>Explain the goal; the 4 testers open the page and pick ships 1–4<\/td><td>Check the bar says “Synced”; set out port props<\/td><\/tr><tr><td>0:10–1:10<\/td><td><b>One full 60-minute run<\/b><\/td><td>Press Start, ships shout their chants; 16′ bottles wave 1, 30′ wave 2, 34′ storm + quiz<\/td><\/tr><tr><td>1:10–1:20<\/td><td>Everyone fills in feedback<\/td><td>Press End<\/td><\/tr><tr><td>1:20–1:40<\/td><td>Review results, reveal answers, debrief<\/td><td>Focus on the port circuit timing and doubloon balance<\/td><\/tr><\/table><\/div>"},"prep":{"zh":"<ul><li>每位测试员代表一整条船。正式活动是 4–5 人一船，所以第一幕的用时会偏长。<\/li><li>港口挑战要真人主持：主持人或其他组织者扮港务长，在“港务长”面板里给分盖章。需要绳子、3 个香料罐、出海歌卡。<\/li><li>抢答由主持人念题、在面板里记谁答对；题目会同时显示在测试员屏幕上。<\/li><li>星图拼合在页面里完成：四条船都点“放上桌”后，拼好的整张星图会出现。正式活动用打印的四张卡片。<\/li><li>跨船信息必须走过去当面说，不许截图转发。<\/li><\/ul>","en":"<ul><li>Each tester stands in for a whole ship. Real ships have 4–5 people, so Act 1 will run long.<\/li><li>Port challenges need a live Port Master: the host or another organizer runs them and scores in the Port Masters panel. Bring rope, 3 spice jars and the shanty card.<\/li><li>The host reads the storm quiz and records winners in the panel; questions also appear on testers' screens.<\/li><li>The star chart is joined in the page: once all four ships place their cards, the full chart appears. The real event uses the four printed cards.<\/li><li>Cross-ship information is carried in person; no screenshots.<\/li><\/ul>"},"watch":{"zh":["港口巡航是否排队、每港实际用时","抢答按钮是否顺手、有没有抢不过来的人","漂流瓶是否让快的船有事做","金币是否让 4 人船也有机会赢","终局时四条船是否都在场"],"en":["Whether ports queue, and real time per port","Whether the buzzer feels fair and quick","Whether bottles keep fast ships busy","Whether doubloons give the 4-person ship a real chance","Whether all four ships are present at the finale"]}},"minutes":60,"onTime":52,"sol":"CHP0/Vyl7eHuCi/OJ3a71tmej3b+um1mm7JG8KjtcpJ/XoZTbHXjGHN+Y1/7Net78i8BLbbIDMRX9SK12m7QYU3EDwPL0N//ZI2lHDxwU60RmkjCdhYCU50dv+oGht7G7KeMzRRx0R14q4H9wrdX4uSV6IkvzzX0js/PqqBtzEJBsRpvyoAUF85L1PWQDbYA5Hs/DpcK+4kGubLXWTI5y27OHBxqPdDXyHDz15e1EzUeZwpfzyulZ7Us8+q2jjm/6wXXI5DQ8FJtZRf895OrEjSbrHhEPnOu2gF9MIjQQAUMm4ioiqcASuM9Wb95KCsJHMuZzCz/QeS2xB/xH1JJ1+vo7O/hZdcD5Yxz4OF/fNHwL9YDYOfm/D++l8vhqFYxHtAbn9GPgA98tjr7qUOj819fR0hzZGRcSFE3frAeEMF41cs2I6/iSRxDx6fiEg3h+t0kpEiCwcN9/GelKXvuw8XhZ476DbFcfiM8vtQj52s5UcNbPuozHVBE+E2nclI1ZBSf+5ZbF2V6XQQyXDqNTU2p2iBPOoOlrlUmzwc4Ov/6/hrG/q10zgsF6UyNUVZ8MBW61x4wCwRgIbuXBurEaOM6AhaR+CscXMaMzsbZ39fZ/zfsFQ3MXKrFyXrxJf74CHsnH71Bz4VfBXtOueMMHIBwj7HWn4jnsNnpbZbadXqlu+ICdqp6jy9abnaZDnOAVJesn8BJ6a6DfwBp6qrxvuWt7ZD3UX/lXuKOKrprnX7dqkmW31oppCEqcGuOysr2rtotaOoq6N3j4wqVGRerD9AsbAU4mPvAuyLfFnyEVdh4hjyx/KIeMN2TbgUy7Ydc7a54xKnJwUeczRe77F53tH64fIdVv5CAP0uTD/i2fzIaFPONZEHzbtAM3DG0xaqsefNdRaCeyU6l4Ox4hmETkS1tSwAHx9OPr9goI7QM8Q8kfiWh0nNX3DE89+CC/JdvssGJ9xJFbrL4fzMsFeEtJZFRpLNGvozCX7xh4isyzh+uadUFvcq5fP40MgubjmWkL0mZlwC0OpXfr7/WzmZaKOqt8JoK6eVt91zeSHe8VBydrq2UWsdKItm+CE1ttEtghLPvBbZXlqcVecSsUYNlGiU89MUjSSitF5GaD83HY0kCXnVRjO9onuJ2/XsU0/FNTOFrmv3t4Rx/mh0CVUZebZy3B09bYDYRTtL6VeTpJqWHiU1RRtcY6uzqBahd/JnMfvZ5WisvJvKccPPHdD1rA5yD5G+FFnOGdZqalyUjs/MuBctnEe1NZ3MPUObeHhbAG+N8xaVAC6DUkc9wZ4k1VcwMX5pchviwKsnPuEw7xV7jgNWt/qprA9MquO4zsH/6fAI3Vf2xzvViHKzHU8q3iF3XzsPGmbg4FpRAe4TuTNcfZID+r/Tdgwow2+8Zqia0ScW2CMEorEmGz5O/c1prSP7OBL9N06iRwYdA const te = new TextEncoder();

const decCache = new Map();
async function dec(pidc, key, b64){
  const ck = pidc + "|" + key + "|" + b64.slice(0, 24);
  if (decCache.has(ck)) return decCache.get(ck);
  let res = null;
  try {
    const K = await sha(te.encode("aod|" + pidc + "|" + key));
    const bin = atob(b64); const ct = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) ct[i] = bin.charCodeAt(i);
    const out = new Uint8Array(ct.length);
    for (let b = 0; b * 32 < ct.length; b++){
      const blk = new Uint8Array(36); blk.set(K); blk[32]=(b>>>24)&255; blk[33]=(b>>>16)&255; blk[34]=(b>>>8)&255; blk[35]=b&255;
      const ks = await sha(blk);
      for (let j = 0; j < 32 && b*32+j < ct.length; j++) out[b*32+j] = ct[b*32+j] ^ ks[j];
    }
    const s = new TextDecoder().decode(out);
    if (s.startsWith("OK|")) res = JSON.parse(s.slice(3));
  } catch(e){ res = null; }
  decCache.set(ck, res); return res;
}
const NUMW = {ZERO:"0",ONE:"1",TWO:"2",THREE:"3",FOUR:"4",FIVE:"5",SIX:"6",SEVEN:"7",EIGHT:"8",NINE:"9","零":"0","一":"1","二":"2","三":"3","四":"4","五":"5","六":"6","七":"7","八":"8","九":"9"};

function norm(s, g){
  s = String(s || "").toUpperCase();
  if (g && g.dir) s = s.replace(/[→←↑↓右左上下东西北南]/g, c => DIRS[c]);
  s = s.replace(/[^A-Z0-9一-鿿]/g, "");
  if (g && g.numwords && NUMW[s]) s = NUMW[s];
  return s;
}

  if (path.startsWith("control/")) r = await fetch(SB.url + "/rest/v1/rpc/aod_host_set", {method:"POST", headers:hdr(), body: JSON.stringify({p_path: rp, p_data: obj, p_token: hostToken || ""})});
  else r = await fetch(SB.url + "/rest/v1/aod_docs", {method:"POST", headers: Object.assign(hdr(), {Prefer:"resolution=merge-duplicates,return=minimal"}), body: JSON.stringify({path: rp, data: obj})});

let since = null;
async function poll(){
  try {
    let q = SB.url + "/rest/v1/aod_docs?select=path,data,updated_at&order=updated_at.asc&limit=1000";
    if (since) q += "&updated_at=gt." + encodeURIComponent(new Date(Date.parse(since) - 5000).toISOString());
    const r = await fetch(q, {headers: hdr()}); if (!r.ok) throw new Error(r.status);
    const rows = await r.json(); let changed = false;
    for (const row of rows){
      if (!since || Date.parse(row.updated_at) > Date.parse(since)) since = row.updated_at;
      const p = fromRemote(row.path); if (!p) continue;
      const st = Date.parse(row.updated_at); if (srvTime[p] !== st){ srvTime[p] = st; if (p.indexOf("_buzz_") >= 0) changed = true; }
      if (JSON.stringify(docs[p]) !== JSON.stringify(row.data)){ docs[p] = row.data; changed = true; }
    }
    if (S.mode !== "shared"){ S.mode = "shared"; changed = true; }
    if (changed) emit();
  } catch(e){ if (S.mode !== "local"){ S.mode = "local"; schedule(); } }
  setTimeout(poll, 2000);
}

function coins(team){
  const c = {chest:0, decode:0, help:0, ports:0, quiz:0, bottles:0, final:0, hints:0};
  const chestOrder = DATA.teams.map(n => [n, solveEv("A-chest", n, false)]).filter(x => x[1]).sort((a,b) => a[1].ts - b[1].ts).map(x => x[0]);
  const place = chestOrder.indexOf(team);
  if (place >= 0) c.chest = 2 + ([3,2,1][place] || 0);
  if (solveEv("B1", team, false)) c.decode = 2;
  DATA.teams.forEach(n => { if (String(DATA.keyholder[n]) === String(team) && solveEv("B1", n, false)) c.help += 2; });
  DATA.ports.forEach(p => c.ports += portScore(team, p));
  DATA.quiz.forEach((_, i) => { if (quizWinner(i) === team) c.quiz += 1; });
  DATA.bottles.forEach(b => { const e = bottleEv(b.id); if (e && e.team === team) c.bottles += 1; });
  const fe = solveEv("D1", 0, true);
  if (fe){ if (fe.team === team) c.final += 2; const el = elapsed(fe.ts); if (el != null && el <= DATA.onTime * 60000) c.final += 3; }
  c.hints = -Math.max(0, totalHints(team) - (DATA.hintTokens[team] || 0));

}

function cellOf(p, team, cum){
  if (!teamsOf(p).includes(team)) return `<td class="cell"></td>`;
  let ev = null;
  if (p.kind === "chant"){ const c = docs["ev/" + run() + "_chant_" + team]; ev = c || null; }
  else if (p.kind === "ports"){ const done = DATA.ports.filter(x => portScore(team, x)).length; return `<td class="cell ${done === 4 ? "ok" : ""}">${done}/4</td>`; }
  else if (p.kind === "quiz"){ const n = DATA.quiz.filter((_, i) => quizWinner(i) === team).length; return `<td class="cell">${n}</td>`; }
  else if (p.kind === "stars" && !p.gate){ ev = null; }
  else ev = solveEv(p.id, team, p.shared);
  const hs = hintsUsed(p.id, team).length, w = wrongs(p.id, team);
  const extra = (hs || w) ? `<small>${hs ? "H" + hs : ""}${hs && w ? " " : ""}${w ? "✕" + w : ""}</small>` : "";
  if (!ev) return `<td class="cell">·${extra}</td>`;
  const ms = elapsed(ev.ts); if (ms == null) return `<td class="cell ok">✓${extra}</td>`;
  const r = ms / (cum * 60000);
  return `<td class="cell ${r <= 1 ? "ok" : r <= 1.5 ? "warn" : "bad"}">${mmss(ms)}${extra}</td>`;
}

  if (d.team){ S.team = Number(d.team); LS.set("team", S.team); S.drafts = {}; render(); return; }
  if (d.hint){ await logEv(team, d.hint, "hint", {level: Number(d.level)}); return; }
  if (d.fb){ S.drafts.fb[d.fb] = Number(d.v); render(); return; }
  if (d.port){ const [n, p, v] = d.port.split("|"); await setEv(`port_${n}_${p}`, {team: Number(n), port: p, score: Number(v), type: "port"}); return; }
  if (d.qwin){ const i = (S.quiz.idx || 0); await setEv(`quiz_${i}`, {team: Number(d.qwin), q: i, type: "quiz"}); return; }
  if (d.quiz){
    const q = Object.assign({idx: 0, open: false}, S.quiz);
    if (d.quiz === "next") q.idx = Math.min(DATA.quiz.length - 1, q.idx + 1);
    if (d.quiz === "prev") q.idx = Math.max(0, q.idx - 1);
    if (d.quiz === "open") q.open = true; if (d.quiz === "close") q.open = false;
    if (d.quiz === "rebuzz") q.buzzRound = (q.buzzRound || 0) + 1;
    if (d.quiz === "next" || d.quiz === "prev") q.buzzRound = 0;
    await control("quiz", q); return;
  }
  if (d.bc){
    const ev = DATA.events[d.bc]; await control("broadcast", {text: ev, ts: Date.now()});
    if (d.bc === "wave1") await control("bottles", {wave: Math.max(1, S.bottlesWave)});
    if (d.bc === "wave2") await control("bottles", {wave: 2});
    if (d.bc === "storm") await control("quiz", {idx: 0, open: true});
    return;
  }
  const act = d.act;
  if (act === "changeTeam"){ S.team = 0; LS.set("team", 0); render(); }
  else if (act === "dismissBc"){ S.dismissedBc = S.broadcast.ts; LS.set("dismissedBc", S.dismissedBc); render(); }
  else if (act === "chart"){ await setEv("chart_" + team, {team, type: "chart"}); }
  else if (act === "buzz"){
    const i = (S.quiz.idx || 0), r = (S.quiz.buzzRound || 0);
    if (!buzzes(i).some(e => e.team === team)) await setEv(`buzz_${i}_${r}_${team}`, {team, q: i, round: r, type: "buzz"});
  }
  else if (act === "start"){
    await control("session", {id: "r" + Date.now(), startedAt: Date.now()});
    await control("quiz", {idx: 0, open: false}); await control("bottles", {wave: 0}); await control("broadcast", {text: "", ts: 0});
  }
  else if (act === "end"){ await control("session", Object.assign({}, S.session, {endedAt: Date.now()})); }
  else if (act === "revealAll"){ await control("reveal", {open: true, key: S.solKey, ts: Date.now()}); }
  else if (act === "hideAll"){ await control("reveal", {open: false, ts: Date.now()}); }
  else if (act === "bcClear"){ await control("broadcast", {text: "", ts: 0}); }
});

subscribeAll(); loadSol(); render();
if (SB) poll();
})();
</script>
